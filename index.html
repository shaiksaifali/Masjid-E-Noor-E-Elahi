  <script>
/* Generated from PrayerCalc.gs — keep identical. */
/**
 * PrayerCalc.gs — offline prayer-time and Hijri calculation (no internet, no paid API).
 * The SAME code is shipped to the public website (community/PrayerCalc.html), so the
 * website and the Google Calendar always show identical times.
 *
 * Method: University of Islamic Sciences, Karachi — Fajr 18°, Isha 18°; Asr Hanafi (shadow factor 2).
 * Sun position: standard low-precision solar coordinates (accurate to ~1 minute for prayer times).
 */
var MasjidTimes = (function () {
  function rad(d) { return d * Math.PI / 180; }
  function deg(r) { return r * 180 / Math.PI; }
  function sin(d) { return Math.sin(rad(d)); }
  function cos(d) { return Math.cos(rad(d)); }
  function tan(d) { return Math.tan(rad(d)); }
  function asin(x) { return deg(Math.asin(x)); }
  function acos(x) { return deg(Math.acos(Math.max(-1, Math.min(1, x)))); }
  function atan2(y, x) { return deg(Math.atan2(y, x)); }
  function acot(x) { return deg(Math.atan(1 / x)); }
  function fix(a, b) { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; }

  function julian(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }
  function sun(jd) {
    var D = jd - 2451545.0;
    var g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360);
    var L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360);
    var e = 23.439 - 0.00000036 * D;
    var RA = atan2(cos(e) * sin(L), cos(L)) / 15;
    return { decl: asin(sin(e) * sin(L)), eqt: q / 15 - fix(RA, 24) };
  }

  var DEFAULTS = { fajrAngle: 18, ishaAngle: 18, asrFactor: 2, dhuhrMin: 1, maghribMin: 0, elevation: 0 };

  /** Prayer times for a calendar date at lat/lng, tz = UTC offset in hours (India 5.5).
   *  Returns minutes after local midnight: {fajr, sunrise, dhuhr, asr, maghrib, isha}. */
  function compute(y, m, d, o) {
    var p = {}; for (var k in DEFAULTS) p[k] = DEFAULTS[k]; for (k in o) p[k] = o[k];
    var lat = +p.lat, lng = +p.lng, tz = +p.tz;
    var jd0 = julian(y, m, d) - lng / (15 * 24);
    function midDay(t) { return fix(12 - sun(jd0 + t).eqt, 24); }
    function angleTime(angle, t, ccw) {
      var s = sun(jd0 + t), noon = midDay(t);
      var T = acos((-sin(angle) - sin(s.decl) * sin(lat)) / (cos(s.decl) * cos(lat))) / 15;
      return noon + (ccw ? -T : T);
    }
    function asrTime(t) {
      var s = sun(jd0 + t);
      return angleTime(-acot(p.asrFactor + tan(Math.abs(lat - s.decl))), t);
    }
    var riseSet = 0.833 + 0.0347 * Math.sqrt(p.elevation || 0);
    var t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18, isha: 18 };
    for (var i = 0; i < 2; i++) { // iterate: use the previous estimate as the time of day for the sun position
      var f = function (h) { return h / 24; };
      t = {
        fajr: angleTime(p.fajrAngle, f(t.fajr), true),
        sunrise: angleTime(riseSet, f(t.sunrise), true),
        dhuhr: midDay(f(t.dhuhr)),

ugh patience and prayer. Indeed, Allah is with the patient","hy":"Ae imaan waalon, sabr aur namaaz se madad lo. Beshak Allah sabr karne waalon ke saath hai.","tr":"Yaaa ayyuhal laazeena aamanus ta'eenoo bissabri was Salaah; innal laaha ma'as-saabireen"},{"k":"2:186","s":"Al-Baqara","sa":"سُوْرَةُ البَقَرَةِ","ar":"وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ ۖ فَلْيَسْتَجِيبُوا لِي وَلْيُؤْمِنُوا بِي لَعَلَّهُمْ يَرْشُدُونَ ۝١٨٦","en":"And when My servants ask you, [O Muhammad], concerning Me - indeed I am near. I respond to the invocation of the supplicant when he calls upon Me. So let them respond to Me [by obedience] and believe in Me that they may be [rightly] guided","hy":"Jab Mere bande Mere baare mein poochte, to (bolo) Main bilkul qareeb hoon. Pukaarne waala jab Mereku pukaarta, Main uski dua qubool karta. To woh bhi Meri baat maanein aur Mere pe imaan rakhein, taaki seedhe raaste pe rahein.","tr":"Wa izaa sa alaka 'ibaadee 'annnee fa innee qareebun ujeebu da'wataddaa'i izaa da'aani falyastajeeboo lee walyu minoo beela 'allahum yarshudoon"},{"k":"2:201","s":"Al-Baqara","sa":"سُوْرَةُ البَقَرَةِ","ar":"وَمِنْهُمْ مَنْ يَقُولُ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ ۝٢٠١","en":"But among them is he who says, \"Our Lord, give us in this world [that which is] good and in the Hereafter [that which is] good and protect us from the punishment of the Fire","hy":"Ae hamaare Rab, hamein duniya mein bhi bhalaai de aur aakhirat mein bhi bhalaai de, aur hamein dozakh ke azaab se bacha.","tr":"Wa minhum mai yaqoolu rabbanaaa aatina fid dunyaa hasanatawn wa fil aakhirati hasanatanw wa qinaa azaaban Naar"},{"k":"2:255","s":"Al-Baqara","sa":"سُوْرَةُ البَقَرَةِ","ar":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ ۝٢٥٥","en":"Allah - there is no deity except Him, the Ever-Living, the Sustainer of [all] existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is [presently] before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Kursi extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great","hy":"Allah — Uske siwa koi maabood nahin. Woh hamesha zinda hai, sab ko sambhaalne waala hai. Usko na oongh aati na neend. Aasmaanon aur zameen mein jo kuch hai sab Uskaich hai. Kaun hai jo Uski ijaazat ke baghair Uske paas sifaarish kare? Woh jaanta jo logon ke aage hai aur jo peeche hai, aur log Uske ilm mein se kuch bhi nahin samajh sakte siwaay jitna Woh chaahe. Uski Kursi aasmaanon aur zameen pe phaili hui hai, aur in dono ki hifaazat Usko thakaati nahin. Woh bahut buland, bahut azmat waala hai.","tr":"Allahu laaa ilaaha illaa Huwal Haiyul Qaiyoom; laa taakhuzuhoo sinatunw wa laa nawm; lahoo maa fissamaawaati wa maa fil ard; man zal lazee yashfa'u indahooo illaa bi-iznih; ya'lamu maa baina aydeehim wa mww khalfahum wa laa yuheetoona bishai'im min 'ilmihee illaa bimaa shaaa'; wasi'a Kursiyyuhus samaawaati wal arda wa laa ya'ooduho hifzuhumaa; wa Huwal Aliyyul 'Azeem"},{"k":"3:8","s":"Aal-i-Imraan","sa":"سُوْرَةُ اٰلِ عِمْرٰنَ","ar":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً ۚ إِنَّكَ أَنْتَ الْوَهَّابُ ۝٨","en":"[Who say], \"Our Lord, let not our hearts deviate after You have guided us and grant us from Yourself mercy. Indeed, You are the Bestower","hy":"Ae hamaare Rab, hidaayat dene ke baad hamaare dilon ko tedha nakko kar, aur Apne paas se hamein rehmat ataa kar. Beshak Aapich sab se zyaada ataa karne waale hain.","tr":"Rabbanaa laa tuzigh quloobanaa ba'da iz hadaitanaa wa hab lanaa mil ladunka rahmah; innaka antal Wahhaab"},{"k":"3:139","s":"Aal-i-Imraan","sa":"سُوْرَةُ اٰلِ عِمْرٰنَ","ar":"وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنْتُمُ الْأَعْلَوْنَ إِنْ كُنْتُمْ مُؤْمِنِينَ ۝١٣٩","en":"So do not weaken and do not grieve, and you will be superior if you are [true] believers","hy":"Himmat nakko haaro aur gham nakko karo. Agar tum sacche momin ho to tumich buland rahoge.","tr":"Wa laa tahinoo wa laa tahzanoo wa antumul a'lawna in kuntum mu'mineen"},{"k":"3:200","s":"Aal-i-Imraan","sa":"سُوْرَةُ اٰلِ عِمْرٰنَ","ar":"يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ ۝٢٠٠","en":"O you who have believed, persevere and endure and remain stationed and fear Allah that you may be successful","hy":"Ae imaan waalon, sabr karo, ek doosre se badh ke sabr karo, (deen ke liye) tayyaar raho, aur Allah se daro taaki kaamyaab ho jaao.","tr":"Yaaa aiyuhal lazeena aamanus biroo wa saabiroo wa raabitoo wattaqul laaha la'allakum tuflihoon"},{"k":"7:23","s":"Al-A'raaf","sa":"سُوْرَةُ الْاَعْرَافِ","ar":"قَالَا رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ ۝٢٣","en":"They said, \"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers","hy":"Dono (Aadam aur Hawwa) bole: Ae hamaare Rab, hum apne aap pe zulm kar liye. Agar Aap hamein maaf nahin karenge aur rahem nahin karenge to hum zaroor nuqsaan waalon mein ho jaayenge.","tr":"Qaalaa Rabbanaa zalamnaaa anfusanaa wa illam taghfir lanaa wa tarhamnaa lanakoonanna minal khaasireen"},{"k":"9:51","s":"At-Tawba","sa":"سُوْرَةُ التَّوْبَةِ","ar":"قُلْ لَنْ يُصِيبَنَا إِلَّا مَا كَتَبَ اللَّهُ لَنَا هُوَ مَوْلَانَا ۚ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ ۝٥١","en":"Say, \"Never will we be struck except by what Allah has decreed for us; He is our protector.\" And upon Allah let the believers rely","hy":"Bolo: hamein wohich pahunchta jo Allah hamaare liye likh diya. Wohich hamaara Maalik hai, aur imaan waalon ko Allahich pe bharosa rakhna chahiye.","tr":"Qul lany-yuseebanaaa illaa maa katabal laahu lanaa Huwa mawlaanaa; wa 'alal laahi falyatawak kalimu 'minoon"},{"k":"11:114","s":"Hud","sa":"سُوْرَةُ هُوْدٍ","ar":"وَأَقِمِ الصَّلَاةَ طَرَفَيِ النَّهَارِ وَزُلَفًا مِنَ اللَّيْلِ ۚ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ۚ ذَٰلِكَ ذِكْرَىٰ لِلذَّاكِرِينَ ۝١١٤","en":"And establish prayer at the two ends of the day and at the approach of the night. Indeed, good deeds do away with misdeeds. That is a reminder for those who remember","hy":"Din ke dono kinaaron mein aur raat ke kuch hisson mein namaaz qaayam karo. Beshak nekiyaan buraaiyon ko mita deti. Yeh naseehat hai yaad rakhne waalon ke liye.","tr":"Wa aqimis Salaata tarafayin nahaari wa zulafam minal layl; innal hasanaati yuzhibnas saiyi aat; zaalika zikraa liz zaakireen"},{"k":"13:28","s":"Ar-Ra'd","sa":"سُوْرَةُ الرَّعْدِ","ar":"الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُمْ بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ۝٢٨","en":"Those who have believed and whose hearts are assured by the remembrance of Allah. Unquestionably, by the remembrance of Allah hearts are assured","hy":"Jo log imaan laaye aur unke dil Allah ki yaad se sukoon paate. Sun lo! Allah ki yaad seich dilon ko sukoon milta.","tr":"Allazeena aamanoo wa tatma'innu quloobuhum bizikril laah; alaa bizikril laahi tatma'innul quloob"},{"k":"14:7","s":"Ibrahim","sa":"سُوْرَةُ اِبْرَاهِيْمَ","ar":"وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِنْ شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِنْ كَفَرْتُمْ إِنَّ عَذَابِي لَشَدِيدٌ ۝٧","en":"And [remember] when your Lord proclaimed, 'If you are grateful, I will surely increase you [in favor]; but if you deny, indeed, My punishment is severe","hy":"Jab tumhaare Rab ne elaan kiya: agar tum shukr karoge to Main tumko aur zyaada doonga, aur agar naashukri karoge to Mera azaab bahut sakht hai.","tr":"Wa iz ta azzana Rabbukum la'in shakartum la azeedannakum wa la'in kafartum inn'azaabee lashadeed"},{"k":"16:97","s":"An-Nahl","sa":"سُوْرَةُ النَّحْلِ","ar":"مَنْ عَمِلَ صَالِحًا مِنْ ذَكَرٍ أَوْ أُنْثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً ۖ وَلَنَجْزِيَنَّهُمْ أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ ۝٩٧","en":"Whoever does righteousness, whether male or female, while he is a believer - We will surely cause him to live a good life, and We will surely give them their reward [in the Hereafter] according to the best of what they used to do","hy":"Jo bhi nek kaam kare, mard ho ya aurat, aur woh momin ho, to Hum usko zaroor paakeeza zindagi denge, aur unke behtareen kaamon ka badla denge.","tr":"Man 'amila saaliham min zakarin aw unsaa wa huwa mu'minun falanuhyiyannahoo hayaatan taiiyibatanw wa lanajzi yannnahum ajrahum bi ahsani maa kaanoo ya'maloon"},{"k":"17:24","s":"Al-Israa","sa":"سُوْرَةُ الإِسۡرَاءِ","ar":"وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا ۝٢٤","en":"And lower to them the wing of humility out of mercy and say, \"My Lord, have mercy upon them as they brought me up [when I was] small","hy":"Maa-baap ke saamne rehmat se aajizi ka baazu jhukaa ke rakho, aur dua karo: Ae mere Rab, in dono pe rahem farma jaise inno mereku bachpan mein paale.","tr":"Wakhfid lahumaa janaahaz zulli minar rahmati wa qur Rabbir hamhumaa kamaa rabbayaanee sagheera"},{"k":"18:10","s":"Al-Kahf","sa":"سُوْرَةُ الْكَهْفِ","ar":"إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا ۝١٠","en":"[Mention] when the youths retreated to the cave and said, \"Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance","hy":"Jab woh naujawaan gufa mein panaah liye aur bole: Ae hamaare Rab, hamein Apne paas se rehmat de aur hamaare kaam mein hamaare liye sahi raasta aasaan kar de.","tr":"Iz awal fityatu ilal Kahfi faqaaloo Rabbanaaa aatinaa mil ladunka rahmatanw wa haiyi' lanaa min amrinaa rashadaa"},{"k":"20:14","s":"Taa-Haa","sa":"سُوْرَةُ طٰهٰ","ar":"إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي ۝١٤","en":"Indeed, I am Allah. There is no deity except Me, so worship Me and establish prayer for My remembrance","hy":"Beshak Mainich Allah hoon, Mere siwa koi maabood nahin. To Meri ibaadat karo aur Meri yaad ke liye namaaz qaayam karo.","tr":"Innaneee Anal laahu laaa ilaaha illaa Ana fa'budnee wa aqimis-salaata lizikree"},{"k":"20:25-28","s":"Taa-Haa","sa":"سُوْرَةُ طٰهٰ","ar":"قَالَ رَبِّ اشْرَحْ لِي صَدْرِي ۝٢٥ وَيَسِّرْ لِي أَمْرِي ۝٢٦ وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي ۝٢٧ يَفْقَهُوا قَوْلِي ۝٢٨","en":"[Moses] said, \"My Lord, expand for me my breast [with assurance] And ease for me my task And untie the knot from my tongue That they may understand my speech","hy":"(Musa AS ne dua kiye:) Ae mere Rab, mera seena khol de, mera kaam aasaan kar de, aur meri zubaan ki girah khol de, taaki log meri baat samjhein.","tr":"Qaala Rabbish rah lee sadree Wa yassir leee amree Wahlul 'uqdatam milli saanee Yafqahoo qawlee"},{"k":"21:87","s":"Al-Anbiyaa","sa":"سُوْرَةُ الْاَنْۣبِيَآءِ","ar":"وَذَا النُّونِ إِذْ ذَهَبَ مُغَاضِبًا فَظَنَّ أَنْ لَنْ نَقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ ۝٨٧","en":"And [mention] the man of the fish, when he went off in anger and thought that We would not decree [anything] upon him. And he called out within the darknesses, \"There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers","hy":"Machhli waale (Yunus AS) ko yaad karo, jab woh naaraaz ho ke chale gaye aur samjhe ki Hum un pe tangi nahin karenge. Phir andheron mein pukaare: Aap ke siwa koi maabood nahin, Aap paak hain, beshak main zaalimon mein se ho gaya.","tr":"Wa Zan Nooni iz zahaba mughaadiban fazaanna al lan naqdira 'alaihi fanaanna al lan naqdira 'alaihi fanaadaa fiz zulumaati al laaa ilaaha illaaa Anta Subhaanaka innee kuntu minaz zaalimeen"},{"k":"23:118","s":"Al-Muminoon","sa":"سُوْرَةُ الْمُؤْمِنُوْنَ","ar":"وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ ۝١١٨","en":"And, [O Muhammad], say, \"My Lord, forgive and have mercy, and You are the best of the merciful","hy":"Aur bolo: Ae mere Rab, maaf kar de aur rahem farma, aur Aap sab se behtar rahem karne waale hain.","tr":"Wa qur Rabbigh fir warham wa Anta khairur raahimeen"},{"k":"25:63","s":"Al-Furqaan","sa":"سُوْرَةُ الْفُرْقَانِ","ar":"وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا ۝٦٣","en":"And the servants of the Most Merciful are those who walk upon the earth easily, and when the ignorant address them [harshly], they say [words of] peace","hy":"Rahmaan ke bande woh hain jo zameen pe aajizi se chalte, aur jab jaahil log un se uljhte to woh salaam bol ke nikal jaate.","tr":"Wa 'ibaadur Rahmaanil lazeena yamshoona 'alal ardi hawnanw wa izaa khaata bahumul jaahiloona qaaloo salaamaa"},{"k":"25:74","s":"Al-Furqaan","sa":"سُوْرَةُ الْفُرْقَانِ","ar":"وَالَّذِينَ يَقُولُونَ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا ۝٧٤","en":"And those who say, \"Our Lord, grant us from among our wives and offspring comfort to our eyes and make us an example for the righteous","hy":"Aur jo dua karte: Ae hamaare Rab, hamaari biwiyon aur bacchon se hamaari aankhon ko thandak de, aur hamein parhezgaaron ka imaam bana.","tr":"Wallazeena yaqooloona Rabbanaa hab lanaa min azwaajinaa wa zurriyaatinaa qurrata a'yuninw waj 'alnaa lilmuttaqeena Imaamaa"},{"k":"29:69","s":"Al-Ankaboot","sa":"سُوْرَةُ الْعَنْكَبُوْتِ","ar":"وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ۚ وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ ۝٦٩","en":"And those who strive for Us - We will surely guide them to Our ways. And indeed, Allah is with the doers of good","hy":"Jo log Hamaare raaste mein mehnat karte, Hum unko zaroor Apne raaste dikhaate. Aur beshak Allah nek kaam karne waalon ke saath hai.","tr":"Wallazeena jaahadoo feenaa lanahdiyannahum subulana; wa innal laaha lama'al muhsineen"},{"k":"31:17","s":"Luqman","sa":"سُوْرَةُ لُقْمَانَ","ar":"يَا بُنَيَّ أَقِمِ الصَّلَاةَ وَأْمُرْ بِالْمَعْرُوفِ وَانْهَ عَنِ الْمُنْكَرِ وَاصْبِرْ عَلَىٰ مَا أَصَابَكَ ۖ إِنَّ ذَٰلِكَ مِنْ عَزْمِ الْأُمُورِ ۝١٧","en":"O my son, establish prayer, enjoin what is right, forbid what is wrong, and be patient over what befalls you. Indeed, [all] that is of the matters [requiring] determination","hy":"(Luqman ne bete ko bole:) Ae mere bete, namaaz qaayam karo, achhi baat ka hukm do, buri baat se roko, aur jo musibat aaye us pe sabr karo. Beshak yeh himmat ke kaam hain.","tr":"Yaa bunaiya aqimis-Salaata waamur bilma'roofi wanha 'anil munkari wasbir 'alaa maaa asaabaka inna zaalika min 'azmil umoor"},{"k":"31:18","s":"Luqman","sa":"سُوْرَةُ لُقْمَانَ","ar":"وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا ۖ إِنَّ اللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ ۝١٨","en":"And do not turn your cheek [in contempt] toward people and do not walk through the earth exultantly. Indeed, Allah does not like everyone self-deluded and boastful","hy":"Logon se moonh pher ke baat nakko karo, aur zameen pe akad ke nakko chalo. Beshak Allah kisi ghamandi, sheikhi maarne waale ko pasand nahin karta.","tr":"Wa laa tusa'-'ir khaddaka linnaasi wa laa tamshi fil ardi maarahan innal laaha laa yuhibbu kulla mukhtaalin fakhoor"},{"k":"33:41-42","s":"Al-Ahzaab","sa":"سُوْرَةُ الْاَحْزَابِ","ar":"يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا ۝٤١ وَسَبِّحُوهُ بُكْرَةً وَأَصِيلًا ۝٤٢","en":"O you who have believed, remember Allah with much remembrance And exalt Him morning and afternoon","hy":"Ae imaan waalon, Allah ko bahut zyaada yaad karo, aur subah shaam Uski tasbeeh karo.","tr":"Yaaa aiyuhal lazeena aamanuz kurul laaha zikran kaseera Wa sabbihoohu bukratanw wa aseela"},{"k":"39:53","s":"Az-Zumar","sa":"سُوْرَةُ الزُّمَرِ","ar":"۞ قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا ۚ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ ۝٥٣","en":"Say, \"O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful","hy":"Bolo: Ae Mere bandon jo apne aap pe zyaadati kar liye, Allah ki rehmat se maayoos nakko ho. Beshak Allah saare gunaah maaf kar deta. Woh bahut maaf karne waala, bahut rahem karne waala hai.","tr":"Qul yaa'ibaadiyal lazeena asrafoo 'alaaa anfusihim laa taqnatoo mirrahmatil laah; innal laaha yaghfiruz zunooba jamee'aa; innahoo Huwal Ghafoorur Raheem"},{"k":"40:60","s":"Ghafir","sa":"سُوْرَةُ الْمُؤْمِنِ","ar":"وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ ۚ إِنَّ الَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِي سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ ۝٦٠","en":"And your Lord says, \"Call upon Me; I will respond to you.\" Indeed, those who disdain My worship will enter Hell [rendered] contemptible","hy":"Tumhaara Rab bola: Mereku pukaaro, Main tumhaari dua qubool karoonga. Jo log Meri ibaadat se ghamand karte, woh zaleel ho ke jahannam mein jaayenge.","tr":"Wa qaala Rabbukumud 'ooneee astajib lakum; innal lazeena yastakbiroona an 'ibaadatee sa yadkhuloona jahannama daakhireen"},{"k":"49:10","s":"Al-Hujuraat","sa":"سُوْرَةُ الْحُجُراتِ","ar":"إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ ۚ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ ۝١٠","en":"The believers are but brothers, so make settlement between your brothers. And fear Allah that you may receive mercy","hy":"Saare momin aapas mein bhai-bhai hain, to apne bhaiyon ke beech sulah karaao, aur Allah se daro taaki tum pe rahem kiya jaaye.","tr":"Innamal mu'minoona ikhwatun fa aslihoo baina akhawaykum wattaqul laaha la'allakum tuhamoon"},{"k":"49:13","s":"Al-Hujuraat","sa":"سُوْرَةُ الْحُجُراتِ","ar":"يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُمْ مِنْ ذَكَرٍ وَأُنْثَىٰ وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا ۚ إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ ۚ إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ ۝١٣","en":"O mankind, indeed We have created you from male and female and made you peoples and tribes that you may know one another. Indeed, the most noble of you in the sight of Allah is the most righteous of you. Indeed, Allah is Knowing and Acquainted","hy":"Ae logon, Hum tumko ek mard aur ek aurat se banaaye, aur tumhaari qaumein aur khaandaan banaaye taaki ek doosre ko pehchaano. Allah ke paas sab se izzat waala wohich hai jo sab se zyaada parhezgaar hai. Beshak Allah sab jaanta, sab ki khabar rakhta.","tr":"Yaaa ayyuhan naasu innaa khalaqnaakum min zakarinw wa unsaa wa ja'alnaakum shu'oobanw wa qabaaa'ila lita'aarafoo inna akramakum 'indal laahi atqaakum innal laaha 'Aleemun khabeer"},{"k":"50:16","s":"Qaaf","sa":"سُوْرَةُ قٓ","ar":"وَلَقَدْ خَلَقْنَا الْإِنْسَانَ وَنَعْلَمُ مَا تُوَسْوِسُ بِهِ نَفْسُهُ ۖ وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ ۝١٦","en":"And We have already created man and know what his soul whispers to him, and We are closer to him than [his] jugular vein","hy":"Hum ne insaan ko banaaye, aur Hum jaante jo waswase uska dil daalta. Aur Hum uski shah-rag (gardan ki nas) se bhi zyaada uske qareeb hain.","tr":"Wa laqad khalaqnal insaana wa na'lamu maa tuwaswisu bihee nafsuhoo wa Nahnu aqrabu ilaihi min hablil wareed"},{"k":"55:13","s":"Ar-Rahmaan","sa":"سُوْرَةُ الرَّحْمٰنِ","ar":"فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ ۝١٣","en":"So which of the favors of your Lord would you deny","hy":"To tum dono (insaan aur jinn) apne Rab ki kaun kaun si nematon ko jhutlaaoge?","tr":"Fabi ayyi aalaaa'i Rabbikumaa tukazzibaan"},{"k":"59:18","s":"Al-Hashr","sa":"سُوْرَةُ الْحَشْرِ","ar":"يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَلْتَنْظُرْ نَفْسٌ مَا قَدَّمَتْ لِغَدٍ ۖ وَاتَّقُوا اللَّهَ ۚ إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ ۝١٨","en":"O you who have believed, fear Allah. And let every soul look to what it has put forth for tomorrow - and fear Allah. Indeed, Allah is Acquainted with what you do","hy":"Ae imaan waalon, Allah se daro, aur har ek dekhe ki kal (aakhirat) ke liye kya aage bheja. Allah se daro, beshak Allah tumhaare har kaam ki khabar rakhta.","tr":"Yaaa ayyuhal lazeena aamanut taqul laa; waltanzur nafsum maa qaddamat lighadiw wattaqual laah; innal laaha khabeerum bimaa ta'maloon"},{"k":"64:16","s":"At-Taghaabun","sa":"سُوْرَةُ التَّغَابُنِ","ar":"فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ وَاسْمَعُوا وَأَطِيعُوا وَأَنْفِقُوا خَيْرًا لِأَنْفُسِكُمْ ۗ وَمَنْ يُوقَ شُحَّ نَفْسِهِ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ ۝١٦","en":"So fear Allah as much as you are able and listen and obey and spend [in the way of Allah]; it is better for your selves. And whoever is protected from the stinginess of his soul - it is those who will be the successful","hy":"Jitna ho sake Allah se daro, suno aur maano, aur (Uske raaste mein) kharch karo, yeh tumhaare apne liye behtar hai. Aur jo apne dil ki kanjoosi se bach gaya, wohich log kaamyaab hain.","tr":"Fattaqul laaha mastat'tum wasma'oo wa atee'oo waanfiqoo khairal li anfusikum; wa many-yooqa shuha nafsihee fa-ulaaa'ika humul muflihoon"},{"k":"65:3","s":"At-Talaaq","sa":"سُوْرَةُ الطَّلَاقِ","ar":"وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَنْ يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ ۚ إِنَّ اللَّهَ بَالِغُ أَمْرِهِ ۚ قَدْ جَعَلَ اللَّهُ لِكُلِّ شَيْءٍ قَدْرًا ۝٣","en":"And will provide for him from where he does not expect. And whoever relies upon Allah - then He is sufficient for him. Indeed, Allah will accomplish His purpose. Allah has already set for everything a [decreed] extent","hy":"Allah usko aisi jagah se rizq deta jahaan se usko gumaan bhi nahin hota. Jo Allah pe bharosa karta, Allah usko kaafi hai. Beshak Allah apna kaam poora kar ke rehta. Allah har cheez ka ek andaaza muqarrar kar diya.","tr":"Wa yarzuqhu min haisu laa yahtasib; wa many yatawakkal 'alal laahi fahuwa husbuh; innal laaha baalighu amrih; qad ja'alal laahu likulli shai'in qadraa"},{"k":"94:5-6","s":"Ash-Sharh","sa":"سُوْرَةُ الشَّرْحِ","ar":"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝٥ إِنَّ مَعَ الْعُسْرِ يُسْرًا ۝٦","en":"For indeed, with hardship [will be] ease Indeed, with hardship [will be] ease","hy":"To beshak mushkil ke saath aasaani hai. Beshak mushkil ke saath aasaani hai.","tr":"Fa inna ma'al usri yusra Inna ma'al 'usri yusra"},{"k":"103:1-3","s":"Al-Asr","sa":"سُوْرَةُ الْعَصْرِ","ar":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالْعَصْرِ ۝١ إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ ۝٢ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ ۝٣","en":"By time Indeed, mankind is in loss Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience","hy":"Zamaane ki qasam! Beshak insaan nuqsaan mein hai, siwaay un logon ke jo imaan laaye, nek kaam kiye, aur ek doosre ko haq aur sabr ki naseehat kiye.","tr":"Wal' asr Innal insaana lafee khusr Il lal lazeena aamanu wa 'amilus saali haati wa tawa saw bil haqqi wa tawa saw bis sabr"},{"k":"112:1-4","s":"Al-Ikhlaas","sa":"سُوْرَةُ الْاِخْلَاصِ","ar":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ هُوَ اللَّهُ أَحَدٌ ۝١ اللَّهُ الصَّمَدُ ۝٢ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝٣ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ۝٤","en":"Say, \"He is Allah, [who is] One Allah, the Eternal Refuge He neither begets nor is born Nor is there to Him any equivalent","hy":"Bolo: Woh Allah ek hai. Allah be-niyaaz hai (kisi ka mohtaaj nahin). Na Usne kisi ko janaa, na Woh kisi se paida hua. Aur koi Uske barabar nahin.","tr":"Qul huwal laahu ahad Allah hus-samad Lam yalid wa lam yoolad Wa lam yakul-lahu kufuwan ahad"},{"k":"2:45","s":"Al-Baqara","sa":"سُوْرَةُ البَقَرَةِ","ar":"وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى الْخَاشِعِينَ ۝٤٥","en":"And seek help through patience and prayer, and indeed, it is difficult except for the humbly submissive [to Allah]","hy":"Sabr aur namaaz se madad lo. Aur yeh (namaaz) bhaari hai, magar aajizi karne waalon pe nahin.","tr":"Wasta'eenoo bissabri was Salaah; wa innahaa lakabee ratun illaa alal khaashi'een"}],"chapters":[[1,"Al-Faatiha","سُوْرَةُ الْفَاتِحَةِ","The Opening",7],[2,"Al-Baqara","سُوْرَةُ البَقَرَةِ","The Cow",286],[3,"Aal-i-Imraan","سُوْرَةُ اٰلِ عِمْرٰنَ","The Family of Imraan",200],[4,"An-Nisaa","سُوْرَةُ النِّسَآءِ","The Women",176],[5,"Al-Maaida","سُوْرَةُ المَآئِدَةِ","The Table",120],[6,"Al-An'aam","سُوْرَةُ الْاَنْعَامِ","The Cattle",165],[7,"Al-A'raaf","سُوْرَةُ الْاَعْرَافِ","The Heights",206],[8,"Al-Anfaal","سُوْرَةُ الْاَنْفَالِ","The Spoils of War",75],[9,"At-Tawba","سُوْرَةُ التَّوْبَةِ","The Repentance",129],[10,"Yunus","سُوْرَةُ يُوْنُسَ","Jonas",109],[11,"Hud","سُوْرَةُ هُوْدٍ","Hud",123],[12,"Yusuf","سُوْرَةُ يُوسُفَ","Joseph",111],[13,"Ar-Ra'd","سُوْرَةُ الرَّعْدِ","The Thunder",43],[14,"Ibrahim","سُوْرَةُ اِبْرَاهِيْمَ","Abraham",52],[15,"Al-Hijr","سُوْرَةُ الْحِجْرِ","The Rock",99],[16,"An-Nahl","سُوْرَةُ النَّحْلِ","The Bee",128],[17,"Al-Israa","سُوْرَةُ الإِسۡرَاءِ","The Night Journey",111],[18,"Al-Kahf","سُوْرَةُ الْكَهْفِ","The Cave",110],[19,"Maryam","سُوْرَةُ مَرْيَمَ","Mary",98],[20,"Taa-Haa","سُوْرَةُ طٰهٰ","Taa-Haa",135],[21,"Al-Anbiyaa","سُوْرَةُ الْاَنْۣبِيَآءِ","The Prophets",112],[22,"Al-Hajj","سُوْرَةُ الْحَجِّ","The Pilgrimage",78],[23,"Al-Muminoon","سُوْرَةُ الْمُؤْمِنُوْنَ","The Believers",118],[24,"An-Noor","سُوْرَةُ النُّوْرِ","The Light",64],[25,"Al-Furqaan","سُوْرَةُ الْفُرْقَانِ","The Criterion",77],[26,"Ash-Shu'araa","سُوْرَةُ الشُّعَرَآءِ","The Poets",227],[27,"An-Naml","سُوْرَةُ النَّمْلِ","The Ant",93],[28,"Al-Qasas","سُوْرَةُ الْقَصَصِ","The St aa'ith"},{"t":{"en":"Leaving the toilet (step out with the right foot)","ur":"عند الخروج من الخلاء (بالرجل اليمنى)"},"ar":"غُفْرَانَكَ","hy":"Ae Allah, Aap se maafi maangta hoon.","en":"I seek Your forgiveness.","ref":"Abu Dawud 30, Tirmidhi 7","tr":"Ghufraanak"},{"t":{"en":"Before wudu","ur":"قبل الوضوء"},"ar":"بِسْمِ اللَّهِ","hy":"Allah ke naam se (shuru karta hoon).","en":"In the name of Allah.","ref":"Abu Dawud 101","tr":"Bismillaah"},{"t":{"en":"After wudu","ur":"بعد الوضوء"},"ar":"أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ","hy":"Main gawaahi deta hoon ki Allah ke siwa koi maabood nahin, Woh akela hai, Uska koi shareek nahin; aur main gawaahi deta hoon ki Muhammad ﷺ Uske bande aur Rasool hain.","en":"I bear witness that there is no god but Allah alone, without partner, and that Muhammad is His servant and Messenger.","ref":"Muslim 234","tr":"Ash-hadu al-laa ilaaha illallaahu wahdahoo laa shareeka lah, wa ash-hadu anna Muhammadan 'abduhoo wa rasooluh"},{"t":{"en":"After the Azan","ur":"بعد الأذان"},"ar":"اللَّهُمَّ رَبَّ هَٰذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ","hy":"Ae Allah, is poori pukaar aur khadi hone waali namaaz ke Rab! Muhammad ﷺ ko Waseela aur buzurgi ataa farma, aur unko us Maqaam-e-Mahmood pe pahuncha jiska Aap ne waada kiye.","en":"O Allah, Lord of this perfect call and the prayer about to be established, grant Muhammad al-Wasilah and excellence, and raise him to the praised station You promised him.","ref":"Bukhari 614","tr":"Allaahumma rabba haazihid-da'watit-taammah, was-salaatil qaa'imah, aati Muhammadanil waseelata wal fadeelah, wab'ath-hu maqaamam mahmoodanil-lazee wa'adtah"},{"t":{"en":"Morning remembrance","ur":"أذكار الصباح"},"ar":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ","hy":"Ae Allah, Aap ki madad se hum ne subah ki aur Aap ki madad se shaam ki, Aap seich hum zinda hain aur Aap seich marenge, aur Aap ki taraf uth ke jaana hai.","en":"O Allah, by You we enter the morning and by You we enter the evening, by You we live and by You we die, and to You is the resurrection.","ref":"Tirmidhi 3391","tr":"Allaahumma bika asbahnaa, wa bika amsainaa, wa bika nahyaa, wa bika namootu, wa ilaikan-nushoor"}]},{"id":"masjid","en":"Going to the masjid","ur":"الذهاب إلى المسجد","icon":"🕌","items":[{"t":{"en":"Entering the masjid (right foot first)","ur":"عند دخول المسجد (بالرجل اليمنى)"},"ar":"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","hy":"Ae Allah, mere liye Apni rehmat ke darwaaze khol de.","en":"O Allah, open for me the doors of Your mercy.","ref":"Muslim 713","tr":"Allaahummaf-tah lee abwaaba rahmatik"},{"t":{"en":"Leaving the masjid (left foot first)","ur":"عند الخروج من المسجد (بالرجل اليسرى)"},"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ","hy":"Ae Allah, main Aap se Aap ka fazl (rozi aur barkat) maangta hoon.","en":"O Allah, I ask You of Your bounty.","ref":"Muslim 713","tr":"Allaahumma innee as'aluka min fadlik"}]},{"id":"out","en":"Dressing, leaving & coming home","ur":"اللباس والخروج والدخول إلى البيت","icon":"🏠","items":[{"t":{"en":"Wearing clothes","ur":"عند لبس الثوب"},"ar":"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَٰذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","hy":"Saari taareef Allah ki jo mereku yeh kapde pehnaaya aur diya, meri koi taaqat aur zor ke baghair.","en":"All praise is for Allah who clothed me with this and provided it for me without any power or strength from me.","ref":"Abu Dawud 4023","tr":"Alhamdu lillaahil-lazee kasaanee haazaa wa razaqaneehi min ghairi hawlim-minnee wa laa quwwah"},{"t":{"en":"Looking in the mirror","ur":"عند النظر في المرآة"},"ar":"اللَّهُمَّ أَنْتَ حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي","hy":"Ae Allah, Aap ne meri soorat achhi banaaye, to mere akhlaaq bhi achhe kar do.","en":"O Allah, You made my appearance beautiful, so make my character beautiful too.","ref":"Musnad Ahmad","tr":"Allaahumma anta hassanta khalqee fa-hassin khuluqee"},{"t":{"en":"Leaving the house","ur":"عند الخروج من البيت"},"ar":"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","hy":"Allah ke naam se nikalta hoon, Allah pe bharosa kiya. Allah ki madad ke baghair na buraai se bachne ki taaqat hai na neki karne ki.","en":"In the name of Allah, I place my trust in Allah; there is no power and no strength except with Allah.","ref":"Abu Dawud 5095, Tirmidhi 3426","tr":"Bismillaahi, tawakkaltu 'alallaahi, wa laa hawla wa laa quwwata illaa billaah"},{"t":{"en":"Riding a vehicle / travelling","ur":"عند الركوب والسفر"},"ar":"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَىٰ رَبِّنَا لَمُنْقَلِبُونَ","hy":"Paak hai Woh jo is (sawaari) ko hamaare qaabu mein diya, warna hum isko qaabu nahin kar sakte the. Aur beshak hum apne Rab ki taraf laut ke jaane waale hain.","en":"Glory be to the One who has subjected this to us, for we could never have done it ourselves; and surely to our Lord we shall return.","ref":"Quran 43:13-14, Abu Dawud 2602","tr":"Subhaanal-lazee sakhkhara lanaa haazaa wa maa kunnaa lahoo muqrineen, wa innaa ilaa rabbinaa lamunqaliboon"},{"t":{"en":"Entering the house (then say Salaam)","ur":"عند دخول البيت (ثم السلام)"},"ar":"بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا","hy":"Allah ke naam se hum andar aaye, Allah ke naam se nikle, aur apne Rab Allah pe bharosa kiye.","en":"In the name of Allah we enter, in the name of Allah we leave, and upon Allah our Lord we rely.","ref":"Abu Dawud 5096","tr":"Bismillaahi walajnaa, wa bismillaahi kharajnaa, wa 'alallaahi rabbinaa tawakkalnaa"}]},{"id":"food","en":"Eating & drinking","ur":"الطعام والشراب","icon":"🍽️","items":[{"t":{"en":"Before eating","ur":"قبل الطعام"},"ar":"بِسْمِ اللَّهِ","hy":"Allah ke naam se (khaana shuru karta hoon).","en":"In the name of Allah.","ref":"Bukhari 5376","tr":"Bismillaah"},{"t":{"en":"If you forgot Bismillah at the start","ur":"إذا نسي التسمية في أوله"},"ar":"بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ","hy":"Allah ke naam se, iske shuru mein bhi aur aakhir mein bhi.","en":"In the name of Allah, at its beginning and at its end.","ref":"Abu Dawud 3767, Tirmidhi 1858","tr":"Bismillaahi awwalahoo wa aakhirah"},{"t":{"en":"After eating","ur":"بعد الطعام"},"ar":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَٰذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","hy":"Saari taareef Allah ki jo mereku yeh khilaaya aur diya, meri koi taaqat aur zor ke baghair.","en":"All praise is for Allah who fed me this and provided it for me without any power or strength from me.","ref":"Abu Dawud 4023, Tirmidhi 3458","tr":"Alhamdu lillaahil-lazee at'amanee haazaa wa razaqaneehi min ghairi hawlim-minnee wa laa quwwah"},{"t":{"en":"For the host who fed you","ur":"الدعاء لصاحب الطعام"},"ar":"اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ","hy":"Ae Allah, inko jo rizq diye us mein barkat de, inko maaf kar aur in pe rahem farma.","en":"O Allah, bless them in what You have provided them, forgive them and have mercy on them.","ref":"Muslim 2042","tr":"Allaahumma baarik lahum feemaa razaqtahum, waghfir lahum warhamhum"}]},{"id":"day","en":"During the day","ur":"خلال اليوم","icon":"☀️","items":[{"t":{"en":"When you sneeze","ur":"عند العطاس"},"ar":"الْحَمْدُ لِلَّهِ","hy":"Chheenkne waala bole \"Alhamdulillah\". Sunne waala bole \"Yarhamukallah\" (Allah tum pe rahem kare). Phir chheenkne waala bole \"Yahdeekumullahu wa yuslihu baalakum\" (Allah tumko hidaayat de aur tumhaara haal durust kare).","en":"The one who sneezes says 'Alhamdulillah'; the listener replies 'Yarhamuk-Allah' (may Allah have mercy on you); and the sneezer answers 'Yahdikumullahu wa yuslihu balakum' (may Allah guide you and set your affairs right).","ref":"Bukhari 6224","tr":"Alhamdu lillaah — (reply) Yarhamukallaah — (then) Yahdeekumullaahu wa yuslihu baalakum"},{"t":{"en":"Thanking someone","ur":"عند شكر أحد"},"ar":"جَزَاكَ اللَّهُ خَيْرًا","hy":"Allah tumko iska achha badla de.","en":"May Allah reward you with good.","ref":"Tirmidhi 2035","tr":"Jazaakallaahu khairaa"},{"t":{"en":"Visiting a sick person","ur":"عند عيادة المريض"},"ar":"لَا بَأْسَ، طَهُورٌ إِنْ شَاءَ اللَّهُ","hy":"Koi baat nahin, insha'Allah yeh beemaari (gunaahon se) paak karne waali hai.","en":"No harm; it is a purification, if Allah wills.","ref":"Bukhari 3616","tr":"Laa ba'sa, tahoorun in shaa' Allaah"},{"t":{"en":"Worry and stress","ur":"عند الهم والحزن"},"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","hy":"Ae Allah, main Aap ki panaah maangta hoon fikr aur gham se, kamzori aur susti se, kanjoosi aur buzdili se, qarz ke bojh se aur logon ke dabaav se.","en":"O Allah, I seek refuge in You from worry and grief, from weakness and laziness, from miserliness and cowardice, from the burden of debt and from being overpowered by people.","ref":"Bukhari 6369","tr":"Allaahumma innee a'oozu bika minal hammi wal hazan, wal 'ajzi wal kasal, wal bukhli wal jubn, wa dala'id-daini wa ghalabatir-rijaal"},{"t":{"en":"In any difficulty (dua of Yunus AS)","ur":"عند الكرب (دعاء يونس عليه السلام)"},"ar":"لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ","hy":"Aap ke siwa koi maabood nahin, Aap paak hain, beshak main hi zaalimon mein se tha.","en":"There is no god but You, glory be to You; I have indeed been among the wrongdoers.","ref":"Quran 21:87, Tirmidhi 3505","tr":"Laa ilaaha illaa anta subhaanaka innee kuntu minaz-zaalimeen"},{"t":{"en":"Asking forgiveness (many times a day)","ur":"الاستغفار (مرات كثيرة في اليوم)"},"ar":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","hy":"Main Allah se maafi maangta hoon aur Usich ki taraf palatta (tauba karta) hoon.","en":"I seek Allah's forgiveness and turn to Him in repentance.","ref":"Bukhari 6307","tr":"Astaghfirullaaha wa atoobu ilaih"},{"t":{"en":"For parents","ur":"للوالدين"},"ar":"رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","hy":"Ae mere Rab, in dono pe rahem farma jaise inno mereku bachpan mein paale.","en":"My Lord, have mercy on them both as they raised me when I was small.","ref":"Quran 17:24","tr":"Rabbir-hamhumaa kamaa rabbayaanee sagheeraa"},{"t":{"en":"Best of this world and the next","ur":"خير الدنيا والآخرة"},"ar":"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","hy":"Ae hamaare Rab, hamein duniya mein bhi bhalaai de, aakhirat mein bhi bhalaai de, aur dozakh ke azaab se bacha.","en":"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","ref":"Quran 2:201, Bukhari 6389","tr":"Rabbanaa aatinaa fid-dunyaa hasanatan wa fil aakhirati hasanatan wa qinaa 'azaaban-naar"},{"t":{"en":"When it rains","ur":"عند نزول المطر"},"ar":"اللَّهُمَّ صَيِّبًا نَافِعًا","hy":"Ae Allah, isko faayde waali baarish bana.","en":"O Allah, make it a beneficial rain.","ref":"Bukhari 1032","tr":"Allaahumma sayyiban naafi'aa"},{"t":{"en":"Hearing of a death or loss","ur":"عند المصيبة أو سماع خبر الوفاة"},"ar":"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ","hy":"Beshak hum Allah keich hain aur Usich ki taraf laut ke jaane waale hain.","en":"Surely we belong to Allah and to Him we shall return.","ref":"Quran 2:156, Muslim 918","tr":"Innaa lillaahi wa innaa ilaihi raaji'oon"}]},{"id":"ramadan","en":"Ramadan & new moon","ur":"رمضان والهلال","icon":"🌙","items":[{"t":{"en":"Breaking the fast (after Iftar)","ur":"بعد الإفطار"},"ar":"ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ","hy":"Pyaas chali gayi, ragein tar ho gayin, aur insha'Allah sawaab pakka ho gaya.","en":"The thirst is gone, the veins are moistened, and the reward is confirmed, if Allah wills.","ref":"Abu Dawud 2357","tr":"Zahabaz-zama'u wabtallatil 'urooqu wa thabatal ajru in shaa' Allaah"},{"t":{"en":"Seeing the new moon","ur":"عند رؤية الهلال"},"ar":"اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ، رَبِّي وَرَبُّكَ اللَّهُ","hy":"Ae Allah, is chaand ko hum pe barkat, imaan, salaamati aur Islam ke saath nikaal. (Ae chaand) mera aur tera Rab Allah hai.","en":"O Allah, bring this moon over us with blessing and faith, safety and Islam. My Lord and your Lord is Allah.","ref":"Tirmidhi 3451","tr":"Allaahumma ahillahoo 'alainaa bil-yumni wal eemaan, was-salaamati wal islaam, rabbee wa rabbukallaah"}]},{"id":"night","en":"Evening & before sleeping","ur":"المساء وقبل النوم","icon":"🌌","items":[{"t":{"en":"Evening remembrance","ur":"أذكار المساء"},"ar":"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ","hy":"Ae Allah, Aap ki madad se hum ne shaam ki aur subah ki, Aap seich zinda hain aur Aap seich marenge, aur Aap ki taraf laut ke jaana hai.","en":"O Allah, by You we enter the evening and by You we enter the morning, by You we live and by You we die, and to You is the final return.","ref":"Tirmidhi 3391","tr":"Allaahumma bika amsainaa, wa bika asbahnaa, wa bika nahyaa, wa bika namootu, wa ilaikal maseer"},{"t":{"en":"Before sleeping: Ayat-ul-Kursi","ur":"قبل النوم: آية الكرسي"},"ar":"","hy":"Sone se pehle Ayat-ul-Kursi (Surah Baqarah 2:255) padho — raat bhar Allah ki taraf se hifaazat rehti, aur subah tak shaitaan qareeb nahin aata.","en":"Recite Ayat-ul-Kursi (2:255) before sleeping: a guardian from Allah stays with you and Shaytan does not come near you until morning.","ref":"Bukhari 2311","quran":"2:255","tr":"Allahu laaa ilaaha illaa Huwal Haiyul Qaiyoom; laa taakhuzuhoo sinatunw wa laa nawm; lahoo maa fissamaawaati wa maa fil ard; man zal lazee yashfa'u indahooo illaa bi-iznih; ya'lamu maa baina aydeehim wa mww khalfahum wa laa yuheetoona bishai'im min 'ilmihee illaa bimaa shaaa'; wasi'a Kursiyyuhus samaawaati wal arda wa laa ya'ooduho hifzuhumaa; wa Huwal Aliyyul 'Azeem"},{"t":{"en":"Before sleeping: the three Quls","ur":"قبل النوم: المعوذات"},"ar":"","hy":"Dono haath jod ke Surah Ikhlaas, Falaq aur Naas padho, haathon pe phoonko, aur jahaan tak haath pahunche saare badan pe phero — teen martaba.","en":"Cup your hands, recite Surah al-Ikhlas, al-Falaq and an-Nas, blow into them and wipe over as much of your body as you can, three times.","ref":"Bukhari 5017","tr":""},{"t":{"en":"Before sleeping: Tasbih Fatimi","ur":"قبل النوم: تسبيح فاطمة"},"ar":"سُبْحَانَ اللَّهِ ×33 · الْحَمْدُ لِلَّهِ ×33 · اللَّهُ أَكْبَرُ ×34","hy":"SubhanAllah 33 baar, Alhamdulillah 33 baar, Allahu Akbar 34 baar. Nabi ﷺ ne farmaaye yeh khaadim (naukar) se behtar hai.","en":"SubhanAllah 33 times, Alhamdulillah 33 times and Allahu Akbar 34 times. The Prophet ﷺ said this is better than a servant.","ref":"Bukhari 3705","tr":"Subhaanallaah ×33 · Alhamdu lillaah ×33 · Allaahu Akbar ×34"},{"t":{"en":"Lying down to sleep","ur":"عند النوم"},"ar":"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","hy":"Ae Allah, Aap ke naam se marta (sota) hoon aur zinda hota (jaagta) hoon.","en":"In Your name, O Allah, I die and I live.","ref":"Bukhari 6312","tr":"Bismika Allaahumma amootu wa ahyaa"},{"t":{"en":"Protection while sleeping (right hand under cheek)","ur":"للحفظ أثناء النوم (اليد اليمنى تحت الخد)"},"ar":"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ","hy":"Ae Allah, jis din Aap Apne bandon ko uthaayenge, us din mereku Apne azaab se bacha.","en":"O Allah, protect me from Your punishment on the Day You resurrect Your servants.","ref":"Abu Dawud 5045, Tirmidhi 3398","tr":"Allaahumma qinee 'azaabaka yawma tab'athu 'ibaadak"},{"t":{"en":"After a bad dream","ur":"بعد الرؤيا المكروهة"},"ar":"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ","hy":"Baayein taraf teen baar halka thoo-thoo karo, shaitaan se Allah ki panaah maango, karwat badlo, aur khwaab kisi ko nakko batao.","en":"Lightly spit (dry) to the left three times, seek refuge in Allah from Shaytan, turn onto your other side, and do not tell anyone about it.","ref":"Muslim 2261, 2262","tr":"A'oozu billaahi minash-shaitaanir-rajeem"}]}],"hadith":[{"tp":"iman","ar":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى","tr":"Innamal a'maalu bin-niyyaat, wa innamaa li-kullim-ri'im-maa nawaa","hy":"Amal (kaam) niyyat se hote. Har aadmi ko wohich milta jiski usne niyyat kiya.","en":"Actions are only by intentions, and every person will have only what he intended.","b":"bukhari","n":1},{"tp":"iman","ar":"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ","tr":"Laa yu'minu ahadukum hattaa yuhibba li-akheehi maa yuhibbu li-nafsih","hy":"Tum mein se koi poora momin nahin ho sakta jab tak apne bhai ke liye bhi wohich pasand nahin karta jo apne liye pasand karta.","en":"None of you truly believes until he loves for his brother what he loves for himself.","b":"bukhari","n":13},{"tp":"iman","ar":"الْحَيَاءُ مِنَ الْإِيمَانِ","tr":"Al-hayaa'u minal eemaan","hy":"Sharm-o-haya imaan ka hissa hai.","en":"Modesty is part of faith.","b":"bukhari","n":24},{"tp":"iman","ar":"الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ","tr":"Al-mu'minul qawiyyu khairun wa ahabbu ilallaahi minal mu'minid-da'eef","hy":"Taaqatwar momin Allah ke paas kamzor momin se behtar aur zyaada pyaara hai (aur dono mein bhalaai hai).","en":"The strong believer is better and more beloved to Allah than the weak believer (and there is good in both).","b":"muslim","n":2664},{"tp":"salah","ar":"صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي","tr":"Salloo kamaa ra'aytumoonee usallee","hy":"Namaaz waisich padho jaisa tum mereku padhte dekhe.","en":"Pray as you have seen me praying.","b":"bukhari","n":631},{"tp":"salah","ar":"صَلَاةُ الْجَمَاعَةِ تَفْضُلُ صَلَاةَ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً","tr":"Salaatul jamaa'ati tafdulu salaatal-fazzi bi-sab'in wa 'ishreena darajah","hy":"Jamaat ki namaaz akele ki namaaz se sattaais (27) darje zyaada hai.","en":"Prayer in congregation is twenty-seven degrees better than prayer alone.","b":"bukhari","n":645},{"tp":"salah","ar":"مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ","tr":"Man sallal bardaini dakhalal jannah","hy":"Jo Fajr aur Asr (dono thande waqt ki namaazein) paabandi se padha, woh Jannat mein jaayega.","en":"Whoever prays the two cool prayers (Fajr and Asr) will enter Paradise.","b":"bukhari","n":574},{"tp":"salah","ar":"إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلْيَرْكَعْ رَكْعَتَيْنِ قَبْلَ أَنْ يَجْلِسَ","tr":"Izaa dakhala ahadukumul masjida falyarka' rak'ataini qabla an yajlis","hy":"Jab masjid mein aao to baithne se pehle do rak'at (Tahiyyatul Masjid) padho.","en":"When one of you enters the masjid, let him pray two rak'ahs before sitting down.","b":"bukhari","n":444},{"tp":"clean","ar":"الطُّهُورُ شَطْرُ الْإِيمَانِ","tr":"At-tuhooru shatrul eemaan","hy":"Paaki (safaai) aadha imaan hai.","en":"Purity is half of faith.","b":"muslim","n":223},{"tp":"clean","ar":"لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي - أَوْ عَلَى النَّاسِ - لَأَمَرْتُهُمْ بِالسِّوَاكِ مَعَ كُلِّ صَلَاةٍ","tr":"Law laa an ashuqqa 'alaa ummatee — aw 'alan-naas — la-amartuhum bis-siwaaki ma'a kulli salaah","hy":"Agar meri ummat pe mushkil nahin hoti to main unko (har namaaz ke saath) miswaak ka hukm deta.","en":"Were it not that it would be hard on my ummah (or: on the people), I would have ordered them to use the siwak with every prayer.","b":"bukhari","n":887},{"tp":"clean","ar":"كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُعْجِبُهُ التَّيَمُّنُ فِي تَنَعُّلِهِ وَتَرَجُّلِهِ وَطُهُورِهِ وَفِي شَأْنِهِ كُلِّهِ","tr":"Kaanan Nabiyyu sallallaahu 'alaihi wa sallam yu'jibuhut-tayammunu fee tana''ulihee wa tarajjulihee wa tuhoorihee wa fee sha'nihee kullih","hy":"Nabi ﷺ ko har kaam daayein (right) taraf se shuru karna pasand tha: joote pehenna, kanghi karna, wuzu, aur har kaam.","en":"The Prophet ﷺ liked to start with the right: in wearing shoes, combing his hair, purifying himself, and in all his affairs.","b":"bukhari","n":168},{"tp":"akhlaq","ar":"مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ","tr":"Man kaana yu'minu billaahi wal yawmil aakhiri falyaqul khairan aw liyasmut","hy":"Jo Allah aur aakhirat ke din pe imaan rakhta, woh achhi baat bole, warna chup rahe.","en":"Whoever believes in Allah and the Last Day, let him speak good or remain silent.","b":"bukhari","n":6018},{"tp":"akhlaq","ar":"الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ","tr":"Al-muslimu man salimal muslimoona min lisaanihee wa yadih","hy":"Asli Musalmaan woh hai jiski zubaan aur haath se doosre Musalmaan mehfooz rahein.","en":"A Muslim is the one from whose tongue and hand other Muslims are safe.","b":"bukhari","n":10},{"tp":"akhlaq","ar":"لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ","tr":"Laisash-shadeedu bis-sura'ah, innamash-shadeedul-lazee yamliku nafsahoo 'indal ghadab","hy":"Pehelwaan woh nahin jo kushti mein gira de; asli taaqatwar woh hai jo gusse mein apne aap ko qaabu mein rakhe.","en":"The strong man is not the one who wrestles others down; the strong man is the one who controls himself when angry.","b":"bukhari","n":6114},{"tp":"akhlaq","ar":"لَا تَغْضَبْ","tr":"Laa taghdab","hy":"Gussa nakko karo. (Aap ﷺ ne yeh naseehat baar baar farmaaye.)","en":"Do not become angry. (He ﷺ repeated this advice several times.)","b":"bukhari","n":6116},{"tp":"akhlaq","ar":"يَسِّرُوا وَلَا تُعَسِّرُوا، وَبَشِّرُوا وَلَا تُنَفِّرُوا","tr":"Yassiroo wa laa tu'assiroo, wa bashshiroo wa laa tunaffiroo","hy":"Aasaani karo, mushkil nakko karo; khushkhabri do, logon ko door nakko bhagao.","en":"Make things easy, not difficult; give good news, and do not drive people away.","b":"bukhari","n":69},{"tp":"akhlaq","ar":"إِنَّ مِنْ خِيَارِكُمْ أَحْسَنَكُمْ أَخْلَاقًا","tr":"Inna min khiyaarikum ahsanakum akhlaaqaa","hy":"Tum mein sab se behtar log woh hain jinke akhlaaq sab se achhe hain.","en":"The best among you are those with the best character.","b":"bukhari","n":3559},{"tp":"akhlaq","ar":"عَلَيْكُمْ بِالصِّدْقِ، فَإِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ","tr":"'Alaikum bis-sidq, fa innas-sidqa yahdee ilal birr, wa innal birra yahdee ilal jannah","hy":"Hamesha sach bolo, kyunki sach neki ki taraf le jaata, aur neki Jannat ki taraf le jaati.","en":"Hold fast to truthfulness, for truthfulness leads to righteousness, and righteousness leads to Paradise.","b":"muslim","n":2607},{"tp":"akhlaq","ar":"الدِّينُ النَّصِيحَةُ","tr":"Ad-deenun naseehah","hy":"Deen (sacche dil se) khair-khwaahi ka naam hai.","en":"The religion is sincere advice (sincerity).","b":"muslim","n":55},{"tp":"akhlaq","ar":"أَفْشُوا السَّلَامَ بَيْنَكُمْ","tr":"Afshus-salaama bainakum","hy":"Aapas mein salaam ko khoob phailaao (is se mohabbat badhti hai).","en":"Spread the greeting of salaam among yourselves (it brings love between you).","b":"muslim","n":54},{"tp":"akhlaq","ar":"مَنْ لَا يَرْحَمُ لَا يُرْحَمُ","tr":"Man laa yarhamu laa yurham","hy":"Jo rahem nahin karta, us pe rahem nahin kiya jaata.","en":"Whoever does not show mercy will not be shown mercy.","b":"bukhari","n":5997},{"tp":"family","ar":"خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ، وَأَنَا خَيْرُكُمْ لِأَهْلِي","tr":"Khairukum khairukum li-ahlihee, wa ana khairukum li-ahlee","hy":"Tum mein sab se achha woh hai jo apne ghar waalon ke saath sab se achha hai, aur main apne ghar waalon ke liye tum sab se achha hoon.","en":"The best of you is the best to his family, and I am the best of you to my family.","b":"tirmidhi","n":3895},{"tp":"family","ar":"مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ حَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ","tr":"Maa zaala Jibreelu yooseenee bil-jaari hattaa zanantu annahoo sa-yuwarrithuh","hy":"Jibreel (AS) mereku padosi ke baare mein itni taakeed kiye ki mereku laga padosi ko wirasat mein bhi hissa mil jaayega.","en":"Jibreel kept advising me about the neighbour until I thought he would make him an heir.","b":"bukhari","n":6015},{"tp":"family","ar":"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ","tr":"Khairukum man ta'allamal Qur'aana wa 'allamah","hy":"Tum mein sab se behtar woh hai jo Quran seekhe aur doosron ko sikhaaye.","en":"The best of you are those who learn the Quran and teach it.","b":"bukhari","n":5027},{"tp":"family","ar":"حَقُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ خَمْسٌ: رَدُّ السَّلَامِ، وَعِيَادَةُ الْمَرِيضِ، وَاتِّبَاعُ الْجَنَائِزِ، وَإِجَابَةُ الدَّعْوَةِ، وَتَشْمِيتُ الْعَاطِسِ","tr":"Haqqul muslimi 'alal muslimi khams: raddus-salaam, wa 'iyaadatul mareed, wattibaa'ul janaa'iz, wa ijaabatud-da'wah, wa tashmeetul 'aatis","hy":"Ek Musalmaan ke doosre Musalmaan pe paanch haq hain: salaam ka jawaab dena, beemaar ki ayaadat karna, janaaze ke saath jaana, daawat qubool karna, aur chheenk ka jawaab (Yarhamukallah) dena.","en":"A Muslim has five rights over another Muslim: returning the salaam, visiting the sick, following the funeral, accepting the invitation, and replying to the one who sneezes.","b":"bukhari","n":1240},{"tp":"daily","ar":"يَا غُلَامُ، سَمِّ اللَّهَ، وَكُلْ بِيَمِينِكَ، وَكُلْ مِمَّا يَلِيكَ","tr":"Yaa ghulaam, sammillaah, wa kul bi-yameenik, wa kul mimmaa yaleek","hy":"Ae bacche, Bismillah padho, daayein haath se khaao, aur apne saamne se khaao.","en":"O boy, mention Allah's name, eat with your right hand, and eat from what is in front of you.","b":"bukhari","n":5376},{"tp":"daily","ar":"مَا عَابَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ طَعَامًا قَطُّ","tr":"Maa 'aaban Nabiyyu sallallaahu 'alaihi wa sallama ta'aaman qatt","hy":"Nabi ﷺ ne kabhi kisi khaane mein aib nahin nikaale: pasand aaya to khaaye, nahin to chhod diye.","en":"The Prophet ﷺ never criticised any food: if he liked it he ate it, otherwise he left it.","b":"bukhari","n":5409},{"tp":"daily","ar":"إِذَا أَتَيْتَ مَضْجَعَكَ فَتَوَضَّأْ وُضُوءَكَ لِلصَّلَاةِ، ثُمَّ اضْطَجِعْ عَلَى شِقِّكَ الْأَيْمَنِ","tr":"Izaa atayta madja'aka fatawadda' wudoo'aka lis-salaah, thummad-taji' 'alaa shiqqikal ayman","hy":"Jab sone ke liye bistar pe jaao to namaaz jaisa wuzu karo, phir daayein karwat pe leto.","en":"When you go to bed, perform wudu as you do for prayer, then lie down on your right side.","b":"bukhari","n":247},{"tp":"daily","ar":"كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا قَامَ مِنَ اللَّيْلِ يَشُوصُ فَاهُ بِالسِّوَاكِ","tr":"Kaanan Nabiyyu sallallaahu 'alaihi wa sallama izaa qaama minal laili yashoosu faahu bis-siwaak","hy":"Nabi ﷺ jab raat ko uthte to miswaak se apna moonh saaf karte.","en":"When the Prophet ﷺ got up at night, he would clean his mouth with the siwak.","b":"bukhari","n":245},{"tp":"daily","ar":"تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ","tr":"Tabassumuka fee wajhi akheeka laka sadaqah","hy":"Apne bhai ko dekh ke muskuraana bhi tumhaare liye sadqa hai.","en":"Your smiling in the face of your brother is charity for you.","b":"tirmidhi","n":1956},{"tp":"ramadan","ar":"مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ","tr":"Man saama Ramadaana eemaanan wahtisaaban ghufira lahoo maa taqaddama min zambih","hy":"Jo imaan ke saath aur sawaab ki ummeed se Ramzaan ke roze rakha, uske pichhle gunaah maaf kar diye jaate.","en":"Whoever fasts Ramadan out of faith and hoping for reward, his previous sins will be forgiven.","b":"bukhari","n":38},{"tp":"ramadan","ar":"تَسَحَّرُوا فَإِنَّ فِي السَّحُورِ بَرَكَةً","tr":"Tasahharoo fa inna fis-sahoori barakah","hy":"Sehri khaao, kyunki sehri mein barkat hai.","en":"Take sehri, for there is blessing in sehri.","b":"bukhari","n":1923},{"tp":"ramadan","ar":"لَا يَزَالُ النَّاسُ بِخَيْرٍ مَا عَجَّلُوا الْفِطْرَ","tr":"Laa yazaalun naasu bi-khairin maa 'ajjalul fitr","hy":"Log jab tak iftaar mein jaldi karte (waqt hote hi kholte), bhalaai mein rahenge.","en":"People will remain upon good as long as they hasten to break the fast.","b":"bukhari","n":1957},{"tp":"ramadan","ar":"إِذَا جَاءَ أَحَدُكُمُ الْجُمُعَةَ فَلْيَغْتَسِلْ","tr":"Izaa jaa'a ahadukumul jumu'ata falyaghtasil","hy":"Jab Jumu'ah ke liye aao to ghusl kar ke aao.","en":"When any of you comes for Jumu'ah, let him take a bath (ghusl).","b":"bukhari","n":877},{"tp":"dhikr","ar":"كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ","tr":"Kalimataani khafeefataani 'alal lisaan, thaqeelataani fil meezaan, habeebataani ilar-Rahmaan: Subhaanallaahi wa bihamdihee, Subhaanallaahil 'Azeem","hy":"Do kalme zubaan pe halke, tarazoo mein bhaari, aur Rahmaan ko bahut pyaare: SubhanAllahi wa bihamdihi, SubhanAllahil Azeem.","en":"Two words are light on the tongue, heavy on the Scale and beloved to the Most Merciful: SubhanAllahi wa bihamdihi, SubhanAllahil-'Azim.","b":"bukhari","n":6682},{"tp":"dhikr","ar":"أَحَبُّ الْأَعْمَالِ إِلَى اللَّهِ تَعَالَى أَدْوَمُهَا وَإِنْ قَلَّ","tr":"Ahabbul a'maali ilallaahi ta'aalaa adwamuhaa wa in qall","hy":"Allah ko sab se pyaare amal woh hain jo paabandi se kiye jaayein, chaahe thode hon.","en":"The most beloved deeds to Allah are those done regularly, even if they are few.","b":"muslim","n":783},{"tp":"dhikr","ar":"الدُّعَاءُ هُوَ الْعِبَادَةُ","tr":"Ad-du'aa'u huwal 'ibaadah","hy":"Dua hi asal ibaadat hai.","en":"Dua (supplication) is worship.","b":"tirmidhi","n":2969},{"tp":"dhikr","ar":"مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ","tr":"Maa naqasat sadaqatun min maal","hy":"Sadqa dene se maal kam nahin hota.","en":"Charity does not decrease wealth.","b":"muslim","n":2588},{"tp":"dhikr","ar":"الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ","tr":"Al-kalimatut-tayyibatu sadaqah","hy":"Achhi baat bolna bhi sadqa hai.","en":"A good word is charity.","b":"bukhari","n":2989}],"htopics":[{"id":"iman","en":"Intention & faith","ur":"النية والإيمان","icon":"🌱"},{"id":"salah","en":"Salah & masjid","ur":"الصلاة والمسجد","icon":"🕌"},{"id":"clean","en":"Cl var WDN = { en: { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' },
  ur: { Mon: 'الاثنين', Tue: 'الثلاثاء', Wed: 'الأربعاء', Thu: 'الخميس', Fri: 'الجمعة', Sat: 'السبت', Sun: 'الأحد' } };
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function T(k) { return (TX[ST.lang] && TX[ST.lang][k]) || (typeof GUIDE !== 'undefined' && GUIDE.ui[ST.lang][k]) || TX.en[k] || (typeof GUIDE !== 'undefined' && GUIDE.ui.en[k]) || k; }
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nl(v) { return esc(v).replace(/\n/g, '<br>'); }
function L(en, ur) { return ST.lang === 'ur' && ur ? ur : en; }
function pn(p) { return ST.lang === 'ur' ? PUR[p] : p; }
function appUrl() { if (window.MASJID_CONFIG && MASJID_CONFIG.loginUrl) return MASJID_CONFIG.loginUrl; var u = String((D.masjid && D.masjid.appUrl) || ''); return /^https:\/\/script\.google\.com\/(a\/[^\/\s]+\/)?macros\/s\/[\w-]+\/exec$/.test(u) ? u : ''; }
function safeUrl(u) { return /^https:\/\/[^\s<>"']+$/i.test(String(u || '')) ? String(u) : ''; }
function $(s) { return document.querySelector(s); }
function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
/* In Urdu (right-to-left) wrap times/dates in Unicode isolates so "4:45 PM" never flips to "PM 4:45". */
function iso(s) { return ST.lang === 'ur' ? '\u2066' + s + '\u2069' : s; }
function hm(min) { return min === null || min === undefined || isNaN(min) ? '\u2014' : iso(MasjidTimes.hhmm(min, true)); }

/* ---- time in the masjid's time zone, whatever the visitor's phone is set to ---- */
function nowM() {
  var tz = (D.calc && D.calc.tz) || 5.5, d = new Date(Date.now() + tz * 3600000);
  return { date: d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()), min: d.getUTCHours() * 60 + d.getUTCMinutes(), sec: d.getUTCSeconds(), dow: (d.getUTCDay() + 6) % 7 };
}
function addDays(ds, k) { var d = new Date(ds + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + k); return d.toISOString().slice(0, 10); }
function dowOf(ds) { return (new Date(ds + 'T12:00:00Z').getUTCDay() + 6) % 7; }
function fmtDate(ds) { var p = String(ds || '').split('-'); return iso(+p[2] + ' ' + MON[+p[1] - 1] + ' ' + p[0]); }
function hasLoc() { return D.calc && D.calc.lat !== null && D.calc.lat !== undefined && D.calc.lng !== null && D.calc.lng !== undefined; }
function azan(ds) {
  if (!hasLoc()) return null;
  var p = ds.split('-').map(Number);
  return MasjidTimes.compute(p[0], p[1], p[2], { lat: D.calc.lat, lng: D.calc.lng, tz: D.calc.tz, fajrAngle: D.calc.fajrAngle, ishaAngle: D.calc.ishaAngle, asrFactor: D.calc.asrFactor });
}
function hijri(ds) { var p = ds.split('-').map(Number); return MasjidTimes.hijri(p[0], p[1], p[2], (D.calc && D.calc.hijriAdjust) || 0); }
var HIJRI_AR = ['محرم', 'صفر', 'ربيع الأول', 'ربيع الآخر', 'جمادى الأولى', 'جمادى الآخرة', 'رجب', 'شعبان', 'رمضان', 'شوال', 'ذو القعدة', 'ذو الحجة'];
function hijriStr(ds) { var h = hijri(ds); return ST.lang === 'ur' ? '\u2067' + h.d + ' ' + HIJRI_AR[h.m - 1] + ' ' + h.y + ' هـ\u2069' : h.d + ' ' + h.en + ' ' + h.y + ' AH'; }
function jamaat(p, ds, az) {
  var r = (D.jamaat || []).filter(function (x) { return x.p === p && x.from <= ds; }).sort(function (a, b) { return a.from < b.from ? 1 : -1; })[0];
  az = az || azan(ds);
  if (r && r.mode === 'FIXED') return MasjidTimes.toMin(r.time);
  if (r && r.mode === 'OFFSET' && az) return az[PK[p]] + (+r.offset || 0);
  return az ? az[PK[p]] : null;
}
function isFriday(ds) { return dowOf(ds) === 4; }
/** Today's 5 prayers (+ Jumu'ah on Friday) as [{p, label, jamaat, azan}] */
function dayPlan(ds) {
  var az = azan(ds), out = [];
  PR.forEach(function (p) {
    if (p === 'Zuhr' && isFriday(ds) && D.jumuah && D.jumuah.jamaat) out.push({ p: 'Jumuah', label: T('jumuah'), jamaat: MasjidTimes.toMin(D.jumuah.jamaat), azan: MasjidTimes.toMin(D.jumuah.azan) });
    else out.push({ p: p, label: pn(p), jamaat: jamaat(p, ds, az), azan: az ? az[PK[p]] : null });
  });
  return out;
}

/* ---- Ramadan ---- */
function ramadan() {
  var r = D.ramadan || {}, start = r.start;
  var est = false;
  if (!start) { // estimate from the Hijri calendar
    var d = nowM().date;
    for (var i = 0; i < 400; i++) { var h = hijri(addDays(d, i)); if (h.m === 9 && h.d === 1) { start = addDays(d, i); est = true; break; } }
  }
  var n = r.days || 30, days = [];
  if (start && hasLoc()) for (var k = 0; k < n; k++) {
    var ds = addDays(start, k), az = azan(ds);
    days.push({ roza: k + 1, date: ds, sehri: az.fajr - (r.sehriSafety || 0), iftar: az.maghrib + (r.iftarSafety || 0) });
  }
  return { start: start, estimated: est, end: start ? addDays(start, n - 1) : null, days: days, info: r };
}

/* ---- links ---- */
function gcalLink(title, ds, startMin, endMin, details, loc) {
  var d = ds.replace(/-/g, ''), dates;
  if (startMin === null || startMin === undefined) dates = d + '/' + addDays(ds, 1).replace(/-/g, '');
  else { var e = endMin || startMin + 60; dates = d + 'T' + pad(Math.floor(startMin / 60)) + pad(startMin % 60) + '00/' + d + 'T' + pad(Math.floor(e / 60) % 24) + pad(e % 60) + '00'; }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title) + '&dates=' + dates + '&ctz=Asia/Kolkata' +
    '&details=' + encodeURIComponent(details || '') + '&location=' + encodeURIComponent(loc || D.masjid.name || '');
}
function wa(text) { var u = safeUrl((window.MASJID_CONFIG && MASJID_CONFIG.siteUrl) || D.masjid.siteUrl); return 'https://wa.me/?text=' + encodeURIComponent(text + (u ? '\n\n' + u : '')); }
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.remove('hidden'); setTimeout(function () { t.classList.add('hidden'); }, 3500); }

var PAGES = ['home', 'timetable', 'ramadan', 'quran', 'hadith', 'duas', 'guide', 'dawat', 'events', 'janazah', 'donate', 'about', 'contact', 'request'];

    '<br><span class="credit">' + esc(T('devBy')) + '</span>' + (appUrl() ? '<br><a class="loginlink" target="_top" href="' + esc(appUrl()) + '">\ud83d\udd12 ' + esc(T('login')) + '</a>' : '');
  var lb = $('#loginBtn'); if (lb) { if (appUrl()) { lb.href = appUrl(); lb.textContent = '\ud83d\udd12 ' + T('login'); lb.classList.remove('hidden'); } else lb.classList.add('hidden'); }
}

  var s = $('#soundBtn'); if (s) s.onclick = function () { ST.sound = !ST.sound; beep(); render(); };
}
var VIEW = {}, AFTER = {};

function announcementsHtml() {
  var t = nowM().date, a = (D.announcements || []).filter(function (x) { return x.StartDate <= t && (!x.EndDate || x.EndDate >= t); })
    .sort(function (x, y) { return (y.Priority === 'Important') - (x.Priority === 'Important') || (x.StartDate < y.StartDate ? 1 : -1); });
  if (!a.length) return '';
  return '<div class="card"><h2>' + esc(T('announcements')) + '</h2>' + a.map(function (x) {
    var title = L(x.Title, x.TitleUr), body = L(x.Body, x.BodyUr);
    return '<div class="ann' + (x.Priority === 'Important' ? ' imp' : '') + '"><b>' + esc(title) + '</b>' + (body ? '<div>' + nl(body) + '</div>' : '') +
      '<div class="btns"><a class="btn" target="_blank" rel="noopener" href="' + esc(wa('📢 ' + D.masjid.name + '\n*' + title + '*' + (body ? '\n\n' + body : ''))) + '">' + esc(T('share')) + '</a></div></div>';
  }).join('') + '</div>';
}
function nextPrayer() {
  var n = nowM(), plan = dayPlan(n.date);
  for (var i = 0; i < plan.length; i++) if (plan[i].jamaat !== null && plan[i].jamaat >= n.min) return { item: plan[i], left: plan[i].jamaat - n.min, date: n.date };
  var tm = addDays(n.date, 1), p2 = dayPlan(tm)[0];
  return p2.jamaat === null ? null : { item: p2, left: p2.jamaat + 1440 - n.min, date: tm };
}
function leftStr(m) {
  if (m <= 0) return T('now');
  var h = Math.floor(m / 60), mm = m % 60;
  return (h ? h + ' ' + T('hr') + ' ' : '') + mm + ' ' + T('min') + (ST.lang === 'ur' ? ' ' + T('in') : '');
}
function remindersCard() {
  var c = D.calendar || {}, sub = safeUrl(c.subscribeUrl), ics = safeUrl(c.icsUrl);
  return '<div class="card"><h2>🔔 ' + esc(T('remindersT')) + '</h2><p class="small">' + esc(T('remindersD')) + '</p><div class="btns">' +
    (sub && c.isPublic ? '<a class="btn pri" target="_blank" rel="noopener" href="' + esc(sub) + '">' + esc(T('subscribe')) + '</a>' : '') +
    (ics && c.isPublic ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(ics) + '">' + esc(T('ics')) + '</a>' : '') +
    (safeUrl(D.masjid.whatsapp) ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(safeUrl(D.masjid.whatsapp)) + '">' + esc(T('whatsapp')) + '</a>' : '') +

function progsOn(ds) {

    .sort(function (a, b) { return progMin(a, ds) - progMin(b, ds); });
}
function progMin(p, ds) { if (p.TimeMode === 'FIXED') return MasjidTimes.toMin(p.Time); var j = jamaat(p.AfterPrayer, ds); return j === null ? 9999 : j + 10; }
function progTime(p) { return p.TimeMode === 'FIXED' ? hm(MasjidTimes.toMin(p.Time)) : T('after') + ' ' + pn(p.AfterPrayer); }
function progHtml(p) {

    '<div class="small">' + esc(WDN[ST.lang][WD[dowOf(e.Date)]]) + (s !== null ? ' · 🕒 ' + esc(hm(s)) + (en !== null ? ' – ' + esc(hm(en)) : '') : '') + (e.Venue ? ' · 📍 ' + esc(e.Venue) : '') + '</div>' +

    '<a class="btn" target="_blank" rel="noopener" href="' + esc(wa('🗓 ' + D.masjid.name + '\n*' + title + '*\n' + fmtDate(e.Date) + (s !== null ? ' · ' + hm(s) : '') + (e.Venue ? '\n📍 ' + e.Venue : ''))) + '">' + esc(T('share')) + '</a></div></div></div>';
}

    '<div class="small">' + esc(T('salah')) + ': ' + esc(min !== null ? hm(min) : T('after') + ' ' + pn(j.AfterPrayer)) + (j.Venue ? ' · 📍 ' + esc(j.Venue) : '') + (j.BurialPlace ? ' · ' + esc(T('burial')) + ': ' + esc(j.BurialPlace) : '') + '</div>' +

VIEW.home = function () {
  var n = nowM(), h = '<div class="bism" lang="ar" dir="rtl">\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u0651\u0670\u0647\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0652\u0645\u0670\u0646\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0650\u064a\u0652\u0645\u0650</div>';
  h += announcementsHtml();
  var jz = (D.janazah || []).filter(function (j) { return j.Date >= addDays(n.date, -1); });
  if (jz.length) h += '<div class="card"><h2>' + esc(T('janazah')) + '</h2><p class="ar">إِنَّا لِلَّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ</p><div class="list">' + jz.map(janazahHtml).join('') + '</div></div>';
  if (!hasLoc() && !(D.jamaat || []).length) h += '<div class="card"><p>' + esc(T('noLoc')) + '</p></div>';
  else {

    h += '<div class="card"><h2>' + esc(T('today')) + ' — ' + esc(WDN[ST.lang][WD[n.dow]]) + '</h2>' + (arcPts.length > 2 ? ART.dayArc(arcPts, n.min, ST.lang === 'ur') : '') + '<div class="times">' + plan.map(function (x) {

      return '<div class="t' + (on ? ' now' : '') + '">' + (ART.icons[x.p] || '') + '<div class="n">' + esc(x.label) + '</div><div class="j">' + esc(hm(x.jamaat)) + '</div><div class="a">' + esc(T('azan')) + ' ' + esc(hm(x.azan)) +

      (!isFriday(n.date) && D.jumuah && D.jumuah.jamaat ? '<div class="t">' + ART.icons.Jumuah + '<div class="n">' + esc(T('jumuah')) + ' (' + esc(T('fri')) + ')</div><div class="j">' + esc(hm(MasjidTimes.toMin(D.jumuah.jamaat))) + '</div><div class="a">' + esc(T('khutbah')) + ' ' + esc(hm(MasjidTimes.toMin(D.jumuah.khutbah))) + '</div></div>' : '') + '</div></div>';
  }
  h += ayahCard();

    if (today) h += '<div class="card next"><h2>' + esc(T('ramadan')) + ' — ' + esc(T('roza')) + ' ' + today.roza + '</h2><div class="times"><div class="t"><div class="n">' + esc(T('sehri')) + '</div><div class="j">' + esc(hm(today.sehri)) + '</div></div><div class="t now"><div class="n">' + esc(T('iftar')) + '</div><div class="j">' + esc(hm(today.iftar)) + '</div></div></div></div>';
    else if (diff > 0 && diff <= 45) h += '<div class="card next"><b>' + esc(T('ramadanIn')) + ' ' + diff + ' ' + esc(T('days')) + '</b> ' + (rm.estimated ? '<span class="small muted">' + esc(T('moon')) + '</span>' : '') + ' <a href="#" data-go="ramadan">→</a></div>';

  if (np && np.left <= 10 && np.left >= 0) showRemind(np.date + np.item.p, np.item.label + ' ' + T('reminderJ') + ' ' + leftStr(np.left) + ' (' + hm(np.item.jamaat) + ')');
  var rm = ramadan(), d = rm.days.filter(function (x) { return x.date === n.date; })[0];
  if (d) {
    if (d.iftar - n.min <= 10 && d.iftar - n.min >= 0) showRemind('iftar' + n.date, T('reminderIftar') + ' ' + leftStr(d.iftar - n.min) + ' (' + hm(d.iftar) + ')');
    if (d.sehri - n.min <= 20 && d.sehri - n.min >= 0) showRemind('sehri' + n.date, T('reminderSehri') + ' ' + leftStr(d.sehri - n.min) + ' (' + hm(d.sehri) + ')');
  }
  if (n.min === 0 && n.sec < 20) render(); // new day
  else if (ST.page === 'home' && typeof DAILY !== 'undefined') { var sl = ayahPick().slot; if (ST.ayahSlot !== undefined && ST.ayahSlot !== sl) render(); ST.ayahSlot = sl; }
}
function refreshData() {
  try { google.script.run.withSuccessHandler(function (s) { if (s && s.v && s.v !== D.v) { D = s; render(); } }).getSnapshot(); } catch (e) { }
}

document.querySelector('.hero').style.backgroundImage = 'url("' + ART.pattern + '"), linear-gradient(135deg,#06331f 0%,#0b4f35 45%,#13734d 100%)';
$('#sky').innerHTML = ART.skyline;
$('#langBtn').onclick = function () { ST.lang = ST.lang === 'ur' ? 'en' : 'ur'; try { localStorage.setItem('mnl_lang', ST.lang); } catch (e) { } render(); };
if (PAGES.indexOf(ST.page) < 0) ST.page = 'home';
render();
setInterval(tick, 20000); tick();
setInterval(refreshData, 15 * 60000);
// count one visit per browser session (cheap: one call, then remembered)
(function countVisit() {
  try { if (sessionStorage.getItem('mnl_counted')) return; } catch (e) { }
  if (!(window.google && google.script && google.script.run && google.script.run.bumpVisit)) return;
  google.script.run.withSuccessHandler(function (r) {
    try { sessionStorage.setItem('mnl_counted', '1'); } catch (e) { }
    if (r && r.visits != null) { window.__visits = r.visits; if (typeof renderFoot === 'function') renderFoot(); else render(); }
  }).withFailureHandler(function () { }).bumpVisit();
})();
</script>
<script>
(function () {
  var started = false, cached = null;
  try { cached = JSON.parse(localStorage.getItem('mnl_snap') || 'null'); } catch (e) { }
  function start(s) {
    if (started) return; started = true; SNAP = s;
    var el = document.createElement('script'); el.textContent = document.getElementById('app-src').textContent; document.body.appendChild(el);
  }
  function save(s) { try { localStorage.setItem('mnl_snap', JSON.stringify(s)); } catch (e) { } }
  function load() {
    MASJID_API.getSnapshot().then(function (s) {
      save(s);
      if (!started) start(s);
      else if (typeof D !== 'undefined' && s && s.v !== D.v) { D = s; render(); }
    }).catch(function (e) {
      if (started) return;
      var box = document.getElementById('loading');
      box.innerHTML = '<p></p><button class="btn" type="button">Try again</button>';
      box.querySelector('p').textContent = e.message;
      box.querySelector('button').onclick = function () { box.innerHTML = '<p>Loading…</p>'; load(); };
    });
  }
  if (cached && cached.masjid) start(cached);
  load();
})();
</script>
