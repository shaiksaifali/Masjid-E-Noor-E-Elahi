  <title>Masjid-E-Noor-Elahi</title>

  <style>
:root{--g:#0f5132;--g2:#157347;--gl:#e8f3ec;--bg:#f4f6f5;--card:#fff;--tx:#1d2521;--mu:#66736c;--bd:#dfe5e1;--red:#b42318;--amb:#b45309;--blue:#1d4ed8;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;font-size:14px;color:var(--tx);background:var(--bg)}
.hidden{display:none!important}
a{color:var(--g2)}
h2{margin:0 0 4px;font-size:20px}h3{margin:0;font-size:16px}
.muted{color:var(--mu)}.err{color:var(--red);min-height:1.2em}.ok{color:var(--g2)}.neg{color:var(--red)}
.right{text-align:right}.nowrap{white-space:nowrap}.small{font-size:12px}
/* Login */
.login-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0f5132,#1b6b45 60%,#e8f3ec 60%)}
.login-card{background:#fff;padding:28px;border-radius:14px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.login-card h1{font-size:20px;margin:6px 0 2px;text-align:center}.login-card .muted{text-align:center;margin:0 0 16px}
.logo{font-size:40px;text-align:center;color:var(--g)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;color:var(--tx);background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #9fd3b4;border-color:var(--g2)}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{display:inline;width:auto;margin:0 6px 0 0}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#f2f5f3}.btn.primary{background:var(--g);border-color:var(--g);color:#fff}.btn.primary:hover{background:var(--g2)}
.btn.danger{color:var(--red);border-color:#f1c4c0}.btn.sm{padding:4px 9px;font-size:12px}.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{background:none;border:0;font-size:18px;cursor:pointer;color:inherit;padding:6px 8px;border-radius:6px}

.brand{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}
.fy-chip{background:rgba(255,255,255,.15);padding:3px 9px;border-radius:20px;font-size:12px}
.user{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.25}
.avatar{width:32px;height:32px;border-radius:50%;background:#c9a227;color:#2a2000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.user .nm{display:flex;flex-direction:column}.user .nm b{font-size:13px}.user .nm span{opacity:.8;font-size:11.5px}
.ubtn{display:inline-flex;align-items:center;gap:6px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit;font-size:12.5px}
.ubtn:hover{background:rgba(255,255,255,.22)}.ubtn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidebar{position:fixed;top:52px;bottom:0;left:0;width:236px;background:#fff;border-right:1px solid var(--bd);overflow:auto;padding:8px 0 30px;z-index:15}
.sidebar{padding:10px 8px 50px}
.mi{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidebar a.top,.ghead{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin:2px 0;border:0;background:none;border-radius:10px;color:#2c3a33;font:600 14px/1.2 inherit;font-family:inherit;text-align:left;cursor:pointer;text-decoration:none}
.sidebar a.top:hover,.ghead:hover{background:#f0f5f2}
.sidebar a.top.active{background:var(--g);color:#fff}
.ghead .lbl,.sidebar a.top .lbl{flex:1}
.chev{width:16px;height:16px;fill:none;stroke:#8a978f;stroke-width:2;transition:transform .2s}
.mgrp.open .chev{transform:rotate(90deg)}
.mgrp.has>.ghead{color:var(--g)}
.mgrp.open>.ghead{background:#f0f5f2}
.gitems{display:none;margin:2px 0 6px 21px;padding-left:8px;border-left:2px solid #e3ebe6}
.mgrp.open .gitems{display:block;animation:mfade .18s ease}

.gitems a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;margin:1px 0;color:#3b4842;text-decoration:none;border-radius:8px;font-size:13.5px}

.badge{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:11px}
.main{margin:52px 0 0 236px;padding:20px;max-width:1300px}

@media(min-width:861px){#menuBtn{display:none}}
/* Cards / layout */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:14px}.page-head .spacer{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px}.kpi .l{font-size:12px;color:var(--mu)}.kpi .v{font-size:21px;font-weight:700;margin-top:4px}.kpi .s{font-size:12px;color:var(--mu);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:960px){.grid2{grid-template-columns:1fr}}

.note{background:#fff8e6;border:1px solid #f5d98b;color:#7a5200;padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}

.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--bd);background:#fff;padding:7px 12px;border-radius:20px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}

.tbl-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.tbl-tools input{max-width:260px;margin:0}
.tbl-wrap{overflow:auto;border:1px solid var(--bd);border-radius:8px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:#f0f4f2;text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid #eef1ef;vertical-align:top}
table.t tr:hover td{background:#fafcfb}
table.t td.m,table.t th.m{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.head td{font-weight:700;background:#f7f9f8}table.t tr.sub td:first-child{padding-left:26px}
table.t tr.total td{font-weight:700;border-top:2px solid #9aa8a0;background:#f0f4f2}
table.t tr.muted td{color:#9aa39e;text-decoration:line-through}table.t tr.neg td{color:var(--red)}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;background:#eef1ef}
.st.POSTED,.st.Paid,.st.Active,.st.APPROVED,.st.ACTIVE{background:#dcfce7;color:#166534}
.st.PENDING_APPROVAL,.st.PENDING,.st.Partial,.st.Due{background:#fef3c7;color:#92400e}
.st.CANCELLED,.st.REJECTED,.st.Inactive,.st.Disabled,.st.WITHDRAWN{background:#fee2e2;color:#991b1b}.st.Waived{background:#e0e7ff;color:#3730a3}
.report-doc .rhead{text-align:center;margin-bottom:10px}.report-doc .rhead h2{margin:4px 0}.report-doc h4{margin:16px 0 6px}
.chart{width:100%;height:290px}
/* Modal, toast, busy */
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow:auto}
.modal-card{background:#fff;border-radius:12px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}.modal-body{padding:16px}
.toasts{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:#1d2521;color:#fff;padding:10px 14px;border-radius:8px;max-width:360px;box-shadow:0 6px 20px rgba(0,0,0,.2)}.toast.e{background:var(--red)}.toast.s{background:var(--g2)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.5);z-index:90;display:flex;align-items:center;justify-content:center}
.spinner{width:38px;height:38px;border:4px solid #cfe3d7;border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.jl td{padding:4px}.jl input,.jl select{margin:0}
.receipt{border:2px solid var(--g);padding:18px;border-radius:6px;max-width:620px;margin:auto;background:#fff}
.receipt h1{margin:0;color:var(--g);text-align:center;font-size:20px}.receipt .ra{text-align:center;font-size:12px;color:#444}
.receipt h4{text-align:center;letter-spacing:4px;margin:12px 0}.receipt table{width:100%;border-collapse:collapse}.receipt td{padding:6px 4px;border-bottom:1px dotted #aaa}
.receipt td.k{width:34%;color:#555}.receipt .amt{font-size:18px;font-weight:700}.receipt .void{color:var(--red);text-align:center;font-weight:800;font-size:22px}
.print-area{display:none}
@media print{body>*:not(.print-area){display:none!important}.print-area{display:block!important;padding:10px}.print-area table.t th{position:static}}
[lang=ur],[dir=rtl]{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;line-height:2}
.days label{display:inline-flex;align-items:center;margin:0 10px 6px 0;font-weight:500;color:var(--tx)}
.pill{display:inline-block;background:var(--gl);color:var(--g);border-radius:12px;padding:1px 8px;font-size:12px;margin:1px}
.timesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.timesgrid div{background:var(--gl);border-radius:8px;padding:10px;text-align:center}
.timesgrid b{display:block;font-size:13px;color:var(--mu)}.timesgrid span{font-size:18px;font-weight:700}
.login-card .credit{text-align:center;margin:14px 0 0}
.credit-side{position:fixed;left:0;bottom:0;width:236px;padding:8px 16px;font-size:11px;color:var(--mu);background:#fff;border-top:1px solid var(--bd);border-right:1px solid var(--bd);z-index:16}
@media(max-width:860px){.credit-side{display:none}}
</style>

  <script>
/* Generated from PrayerCalc.gs — keep identical. */
/**
 * PrayerCalc.gs — offline prayer-time and Hijri calculation (no internet, no paid API).
 * The SAME code is shipped to the public website (community/PrayerCalc.html), so the
 * website and the Google Calendar always show identical times.
 *
 * Method: University of Islamic Sciences, Karachi — Fajr 18°, Isha 18°; Asr Hanafi (shadow factor 2).
 * Sun position: standard low-precision solar coordinates (accurate to ~1 minute for prayer times).
 */
var MasjidTimes = (function () {
  function rad(d) { return d * Math.PI / 180; }
  function deg(r) { return r * 180 / Math.PI; }
  function sin(d) { return Math.sin(rad(d)); }
  function cos(d) { return Math.cos(rad(d)); }
  function tan(d) { return Math.tan(rad(d)); }
  function asin(x) { return deg(Math.asin(x)); }
  function acos(x) { return deg(Math.acos(Math.max(-1, Math.min(1, x)))); }
  function atan2(y, x) { return deg(Math.atan2(y, x)); }
  function acot(x) { return deg(Math.atan(1 / x)); }
  function fix(a, b) { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; }

  function julian(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }
  function sun(jd) {
    var D = jd - 2451545.0;
    var g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360);
    var L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360);
    var e = 23.439 - 0.00000036 * D;
    var RA = atan2(cos(e) * sin(L), cos(L)) / 15;
    return { decl: asin(sin(e) * sin(L)), eqt: q / 15 - fix(RA, 24) };
  }

  var DEFAULTS = { fajrAngle: 18, ishaAngle: 18, asrFactor: 2, dhuhrMin: 1, maghribMin: 0, elevation: 0 };

  /** Prayer times for a calendar date at lat/lng, tz = UTC offset in hours (India 5.5).
   *  Returns minutes after local midnight: {fajr, sunrise, dhuhr, asr, maghrib, isha}. */
  function compute(y, m, d, o) {
    var p = {}; for (var k in DEFAULTS) p[k] = DEFAULTS[k]; for (k in o) p[k] = o[k];
    var lat = +p.lat, lng = +p.lng, tz = +p.tz;
    var jd0 = julian(y, m, d) - lng / (15 * 24);
    function midDay(t) { return fix(12 - sun(jd0 + t).eqt, 24); }
    function angleTime(angle, t, ccw) {
      var s = sun(jd0 + t), noon = midDay(t);
      var T = acos((-sin(angle) - sin(s.decl) * sin(lat)) / (cos(s.decl) * cos(lat))) / 15;
      return noon + (ccw ? -T : T);
    }
    function asrTime(t) {
      var s = sun(jd0 + t);
      return angleTime(-acot(p.asrFactor + tan(Math.abs(lat - s.decl))), t);
    }
    var riseSet = 0.833 + 0.0347 * Math.sqrt(p.elevation || 0);
    var t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18, isha: 18 };
    for (var i = 0; i < 2; i++) { // iterate: use the previous estimate as the time of day for the sun position
      var f = function (h) { return h / 24; };
      t = {
        fajr: angleTime(p.fajrAngle, f(t.fajr), true),
        sunrise: angleTime(riseSet, f(t.sunrise), true),
        dhuhr: midDay(f(t.dhuhr)),
        asr: asrTime(f(t.asr)),
        maghrib: angleTime(riseSet, f(t.maghrib)),
        isha: angleTime(p.ishaAngle, f(t.isha))
      };
    }
    var adj = tz - lng / 15, out = {};
    for (k in t) out[k] = Math.round((fix(t[k] + adj, 24)) * 60);
    out.dhuhr += p.dhuhrMin; out.maghrib += p.maghribMin;
    return out;
  }

  function hhmm(min, twelve) {
    min = ((Math.round(min) % 1440) + 1440) % 1440;
    var h = Math.floor(min / 60), mi = min % 60;
    if (!twelve) return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
    var ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12 || 12;
    return h12 + ':' + (mi < 10 ? '0' : '') + mi + ' ' + ap;
  }
  function toMin(s) { var m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; }

  /** Tabular Islamic (Kuwaiti) calendar + committee adjustment (moon sighting), e.g. adjust = -1. */
  var HIJRI_EN = ['Muharram', 'Safar', 'Rabi al-Awwal', 'Rabi al-Thani', 'Jumada al-Ula', 'Jumada al-Akhirah', 'Rajab', 'Shaban', 'Ramadan', 'Shawwal', 'Dhul Qadah', 'Dhul Hijjah'];
  var HIJRI_UR = ['محرم', 'صفر', 'ربیع الاول', 'ربیع الثانی', 'جمادی الاول', 'جمادی الثانی', 'رجب', 'شعبان', 'رمضان', 'شوال', 'ذوالقعدہ', 'ذوالحجہ'];
  function hijri(y, m, d, adjust) {
    var jd = Math.floor(julian(y, m, d) + 0.5) + (adjust || 0);
    var l = jd - 1948440 + 10632, n = Math.floor((l - 1) / 10631);
    l = l - 10631 * n + 354;
    var j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) + Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
    l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
    var hm = Math.floor((24 * l) / 709), hd = l - Math.floor((709 * hm) / 24), hy = 30 * n + j - 30;
    return { y: hy, m: hm, d: hd, en: HIJRI_EN[hm - 1], ur: HIJRI_UR[hm - 1] };
  }

  return { compute: compute, hhmm: hhmm, toMin: toMin, hijri: hijri, julian: julian, DEFAULTS: DEFAULTS };
})();
</script>

/* ---------- helpers ---------- */
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { if (n === '' || n === null || n === undefined) return ''; return Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function rs(n) { return '₹' + money(n || 0); }
function dmy(d) { if (!d) return ''; const s = String(d), p = s.slice(0, 10).split('-'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] + s.slice(10) : s; }
function today() { return (S.b && S.b.today) || new Date().toISOString().slice(0, 10); }
function can(p) { const ps = (S.user && S.user.perms) || []; return ps.includes('*') || ps.includes(p); }
function st(s) { return '<span class="st ' + esc(s) + '">' + esc(String(s || '').replace(/_/g, ' ')) + '</span>'; }
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

let busyN = 0;
function busy(on) { busyN = Math.max(0, busyN + (on ? 1 : -1)); $('#busy').classList.toggle('hidden', busyN === 0); }
function toast(msg, type) {
  const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), type === 'e' ? 7000 : 3500);
}
function cleanMsg(e) { return String((e && e.message) || e || 'Something went wrong').replace(/^(ScriptError|Exception|Error):\s*/i, ''); }

/** google.script.run → Promise */
function call(action, payload, opt) {
  opt = opt || {};
  if (!opt.quiet) busy(true);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => { if (!opt.quiet) busy(false); resolve(r ? r.data : null); })
      .withFailureHandler(e => {
        if (!opt.quiet) busy(false);
        const m = cleanMsg(e);
        if (/^AUTH:/.test(m)) { toast(m.replace(/^AUTH:\s*/, ''), 'e'); signOut(true); return reject(new Error('auth')); }
        reject(new Error(m));
      })
      .api(S.token, action, payload || {});
  });
}
function fail(e) { if (e && e.message !== 'auth') toast(cleanMsg(e), 'e'); }

function ledgerName(id) {

function opts(list, sel, blank) {

    list.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(sel) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('');

function fundOpts(sel, blank) { return opts((S.b.funds || []).filter(f => f.Status === 'Active').map(f => [f.FundID, f.Name + (f.Type === 'Restricted' ? ' 🔒' : '')]), sel, blank); }
function allLedgerOpts(sel, blank) {

/* ---------- forms ---------- */
function field(f, data) {
  data = data || {};
  const v = data[f.n] !== undefined && data[f.n] !== null ? data[f.n] : (f.v !== undefined ? f.v : '');
  const req = f.req ? ' required' : '', cls = f.full ? ' class="full"' : '';
  const attrs = (f.attrs || '') + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '');
  let input;
  if (f.t === 'select') input = '<select name="' + f.n + '"' + req + attrs + '>' + f.o + '</select>';
  else if (f.t === 'textarea') input = '<textarea name="' + f.n + '"' + req + attrs + '>' + esc(v) + '</textarea>';
  else if (f.t === 'file') input = '<input type="file" name="' + f.n + '" accept="image/jpeg,image/png,image/webp,application/pdf,image/*"' + attrs + '>';
  else input = '<input type="' + (f.t || 'text') + '" name="' + f.n + '" value="' + esc(v) + '"' + req + attrs +
    (f.t === 'number' ? ' step="' + (f.step || '0.01') + '" min="' + (f.min !== undefined ? f.min : '0') + '"' : '') + '>';
  return '<label' + cls + '>' + esc(f.l) + (f.req ? ' *' : '') + input + (f.help ? '<span class="muted small">' + esc(f.help) + '</span>' : '') + '</label>';
}
function formHtml(defs, data, submit) {
  return '<form class="form-grid">' + defs.map(f => field(f, data)).join('') +
    '<div class="full actions"><button class="btn primary" type="submit">' + esc(submit || 'Save') + '</button></div></form>';
}
function readForm(form) {
  const o = {};
  $$('input,select,textarea', form).forEach(el => {
    if (!el.name || el.type === 'file') return;
    if (el.type === 'checkbox') o[el.name] = el.checked; else o[el.name] = el.value.trim();
  });
  return o;
}
/** Reads a file; images are downscaled + JPEG-compressed in the browser to save free Drive space. */
function readFile(input) {
  const f = input && input.files && input.files[0];
  if (!f) return Promise.resolve(null);
  const max = Number((S.b.settings || {}).MAX_UPLOAD_MB || 5) * 1048576;
  return new Promise((resolve, reject) => {
    if (/^image\//.test(f.type) && f.type !== 'image/gif') {
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        const data = c.toDataURL('image/jpeg', 0.78).split(',')[1];
        if (data.length * 0.75 > max) return reject(new Error('Image is too large even after compression.'));
        resolve({ name: f.name, mimeType: 'image/jpeg', data: data });
      };
      img.onerror = () => reject(new Error('Could not read the image.'));
      img.src = url;
    } else if (f.type === 'application/pdf') {
      if (f.size > max) return reject(new Error('PDF is larger than the upload limit.'));
      const r = new FileReader();
      r.onload = () => resolve({ name: f.name, mimeType: 'application/pdf', data: String(r.result).split(',')[1] });
      r.onerror = () => reject(new Error('Could not read the file.'));
      r.readAsDataURL(f);
    } else reject(new Error('Only images (JPG/PNG/WEBP) or PDF files are allowed.'));
  });
}

/* ---------- tables ---------- */
/** cols: [{k, l, m (money), f(row) → safe html, csv(row) → text}] */
function table(el, cols, rows, o) {
  o = o || {};
  const id = 't' + Math.random().toString(36).slice(2, 8);
  el.innerHTML = '<div class="tbl-tools">' + (o.search === false ? '' : '<input type="search" placeholder="Search…" id="' + id + 's">') +
    '<span class="muted small" id="' + id + 'c"></span><span class="spacer" style="flex:1"></span>' +
    (o.csv ? '<button class="btn sm" id="' + id + 'x">⬇ CSV</button>' : '') + '</div><div class="tbl-wrap"><table class="t"><thead><tr>' +
    cols.map(c => '<th' + (c.m ? ' class="m"' : '') + '>' + esc(c.l) + '</th>').join('') + (o.actions ? '<th></th>' : '') + '</tr></thead><tbody id="' + id + 'b"></tbody></table></div>';
  const cell = (c, r) => c.f ? c.f(r) : c.m ? money(r[c.k]) : esc(r[c.k]);
  let shown = rows;
  function paint() {
    const q = o.search === false ? '' : $('#' + id + 's', el).value.toLowerCase();
    shown = q ? rows.filter(r => cols.some(c => String(c.csv ? c.csv(r) : r[c.k] === undefined ? '' : r[c.k]).toLowerCase().includes(q))) : rows;
    const lim = shown.slice(0, 500);
    $('#' + id + 'b', el).innerHTML = lim.length ? lim.map((r, i) => '<tr data-i="' + rows.indexOf(r) + '">' + cols.map(c => '<td' + (c.m ? ' class="m"' : '') + '>' + cell(c, r) + '</td>').join('') +
      (o.actions ? '<td class="nowrap">' + o.actions(r) + '</td>' : '') + '</tr>').join('')
      : '<tr><td colspan="' + (cols.length + 1) + '" class="muted">' + esc(o.empty || 'No records found.') + '</td></tr>';
    $('#' + id + 'c', el).textContent = shown.length > 500 ? 'Showing 500 of ' + shown.length : shown.length + ' record(s)';
  }
  if (o.search !== false) $('#' + id + 's', el).oninput = paint;
  if (o.csv) $('#' + id + 'x', el).onclick = () => downloadText(o.csv + '.csv', toCsv([cols.map(c => c.l)].concat(shown.map(r => cols.map(c => c.csv ? c.csv(r) : r[c.k])))));
  el.onclick = ev => { const b = ev.target.closest('[data-act]'); if (!b || !o.onAction) return; const tr = b.closest('tr'); o.onAction(b.dataset.act, rows[+tr.dataset.i], b); };
  paint();
}
function act(name, label, cls) { return '<button class="btn sm ' + (cls || '') + '" data-act="' + name + '">' + label + '</button> '; }

/* ---------- export / print ---------- */
/** CSV export hardened against spreadsheet formula injection (leading/embedded formula characters, CR/LF, full-width forms). */
function csvCell(v) {
  if (typeof v === 'number') return String(v);
  v = v === null || v === undefined ? '' : String(v);
  v = v.replace(/\r\n?/g, '\n');
  v = v.split('\n').map(line => /^[\s\u200b\u3000]*[=+\-@\uFF1D\uFF0B\uFF0D\uFF20\t|%]/.test(line) ? "'" + line : line).join('\n');
  return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function toCsv(rows) { return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'); }
function downloadText(name, text) { downloadB64(name, 'text/csv;charset=utf-8', btoa(unescape(encodeURIComponent(text)))); }
function downloadB64(name, mime, b64) {
  const a = document.createElement('a'); a.href = 'data:' + mime + ';base64,' + b64; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function printHtml(html) { $('#printArea').innerHTML = html; setTimeout(() => { window.print(); }, 50); }
function viewFile(fileId) {
  call('file.get', { FileID: fileId }).then(f => {
    const src = 'data:' + f.mimeType + ';base64,' + f.data;
    modal(f.name, (/^image\//.test(f.mimeType) ? '<img src="' + src + '" style="max-width:100%">' : '<p>PDF document.</p>') +
      '<div class="actions"><button class="btn primary" id="dl">⬇ Download</button></div>', b => { $('#dl', b).onclick = () => downloadB64(f.name, f.mimeType, f.data); });
  }).catch(fail);
}

/* ---------- report document renderer ---------- */
function docHtml(doc) {
  let h = '<div class="report-doc"><div class="rhead"><strong>' + esc(doc.org) + '</strong><div class="muted small">' + esc(doc.address || '') + '</div><h2>' + esc(doc.title) + '</h2><div class="muted">' + esc(doc.subtitle) + '</div></div>';
  if (doc.warning) h += '<div class="warnbox">' + esc(doc.warning) + '</div>';
  doc.sections.forEach(s => {
    if (s.heading) h += '<h4>' + esc(s.heading) + '</h4>';
    h += '<div class="tbl-wrap"><table class="t"><thead><tr>' + s.columns.map(c => '<th' + (c[1] === 'money' ? ' class="m"' : '') + '>' + esc(c[0]) + '</th>').join('') + '</tr></thead><tbody>' +
      (s.rows.length ? s.rows.map(r => '<tr class="' + esc(r.s) + '">' + r.c.map((v, i) => {
        const t = s.columns[i] && s.columns[i][1];
        return '<td' + (t === 'money' ? ' class="m"' : '') + '>' + (t === 'money' ? money(v) : t === 'date' ? esc(dmy(v)) : esc(v)) + '</td>';
      }).join('') + '</tr>').join('') : '<tr><td class="muted" colspan="' + s.columns.length + '">No entries.</td></tr>') + '</tbody></table></div>';
  });
  return h + '<p class="muted small">Generated ' + esc(dmy(doc.generatedAt)) + '</p></div>';
}
function docCsv(doc) {
  const rows = [[doc.org], [doc.title], [doc.subtitle], []];
  doc.sections.forEach(s => { if (s.heading) rows.push([s.heading]); rows.push(s.columns.map(c => c[0])); s.rows.forEach(r => rows.push(r.c)); rows.push([]); });
  return toCsv(rows);
}

/* =====================================================================
 * Auth
 * ===================================================================== */
function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
function signOut(silent) {
  if (!silent && S.token) call('auth.logout', {}, { quiet: true }).catch(() => { });
  S.token = null; store('mms_token', null); closeModal(); showLogin();
}
$('#loginForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const f = readForm(ev.target); $('#loginErr').textContent = ''; busy(true);
  google.script.run.withSuccessHandler(r => { busy(false); S.token = r.token; store('mms_token', r.token); ev.target.reset(); boot(r.boot); })
    .withFailureHandler(e => { busy(false); $('#loginErr').textContent = cleanMsg(e); })
    .apiLogin(f.email, f.password, true);
});
function boot(pre) {
  (pre ? Promise.resolve(pre) : call('bootstrap', { dash: true })).then(b => {
    S.preDash = b.dashboard ? { d: b.dashboard, at: Date.now() } : null; delete b.dashboard;
    S.b = b; S.user = b.user;
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    $('#brand').textContent = (b.settings && b.settings.MASJID_NAME) || b.app.name;
    $('#fyChip').textContent = b.fy ? 'FY ' + b.fy : '';
    const ini = String(b.user.name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    $('#userBox').innerHTML = '<span class="avatar">' + esc(ini) + '</span><span class="nm"><b>' + esc(b.user.name) + '</b><span>' + esc(b.user.roleLabel) + '</span></span>' +
      '<button id="pwBtn" class="ubtn" title="Change password" aria-label="Change password"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg></button>' +
      '<button id="outBtn" class="ubtn out" title="Sign out"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span>Sign out</span></button>';
    $('#outBtn').onclick = () => signOut(); $('#pwBtn').onclick = () => changePassword(false);
    if (b.user.mustChange) { $('#sidebar').innerHTML = ''; $('#main').innerHTML = '<div class="card">Please set a new password to continue.</div>'; return changePassword(true); }
    renderMenu(); go(S.view || 'dashboard', S.params);
  }).catch(e => { if (e.message !== 'auth') { toast(cleanMsg(e), 'e'); showLogin(); } });
}
function refreshBoot() { return call('bootstrap', {}, { quiet: true }).then(b => { S.b = b; S.user = b.user; renderMenu(); }); }
function changePassword(forced) {
  modal(forced ? 'Set a new password' : 'Change password', formHtml([
    { n: 'oldPassword', l: forced ? 'Temporary password' : 'Current password', t: 'password', req: true, full: true },
    { n: 'newPassword', l: 'New password (8+ characters, letters and numbers)', t: 'password', req: true, full: true },
    { n: 'confirm', l: 'Confirm new password', t: 'password', req: true, full: true }], {}, 'Update password'), b => {
    if (forced) $('#modalClose').style.display = 'none';
    $('form', b).onsubmit = ev => {
      ev.preventDefault(); const f = readForm(ev.target);
      if (f.newPassword !== f.confirm) return toast('Passwords do not match.', 'e');
      call('auth.changePassword', f).then(() => { $('#modalClose').style.display = ''; closeModal(); toast('Password updated.', 's'); boot(); }).catch(fail);
    };
  });
}

  const s = S.b.settings || {};
  if (s.LATITUDE === '' || s.LONGITUDE === '' || s.LATITUDE === undefined) return null;
  return { lat: +s.LATITUDE, lng: +s.LONGITUDE, tz: 5.5, fajrAngle: +s.FAJR_ANGLE || 18, ishaAngle: +s.ISHA_ANGLE || 18, asrFactor: s.ASR_METHOD === 'Shafi' ? 1 : 2 };

  if (r && r.Mode === 'FIXED') return { min: MasjidTimes.toMin(r.Time), rule: r };
  if (r && r.Mode === 'OFFSET' && az) return { min: az[PKEY[prayer]] + Number(r.OffsetMin || 0), rule: r };
  return { min: az ? az[PKEY[prayer]] : null, rule: null };
}
const t12 = m => m === null || m === undefined ? '—' : MasjidTimes.hhmm(m, true);
const tt = v => v ? MasjidTimes.hhmm(MasjidTimes.toMin(v), true) : '';

function cwList(view, cfg) {
  VIEWS[view] = { perm: 'community.edit', fn: el => {
    el.innerHTML = head(cfg.title, cfg.sub, '<button class="btn primary" id="cwAdd">+ ' + esc(cfg.addLabel) + '</button>') + '<div class="card" id="cwl">Loading…</div>';
    $('#cwAdd').onclick = () => cwForm(view, cfg, {});
    loadCW().then(d => {
      const rows = d[cfg.key];
      table($('#cwl'), cfg.cols, rows, {
        csv: cfg.key, empty: cfg.empty,
        actions: r => act('e', 'Edit') + (cfg.share ? '<a class="btn sm" target="_blank" rel="noopener" href="' + esc(waShare(cfg.share(r) + siteLine())) + '">WhatsApp</a> ' : '') +
          (r.Status === 'Active' ? act('x', 'Hide', 'danger') : act('a', 'Show')),
        onAction: (a, r) => {
          if (a === 'e') return cwForm(view, cfg, r);
          const p = Object.assign({}, r, { Status: a === 'x' ? 'Inactive' : 'Active' });
          call(cfg.action, p).then(x => { cwSaved(x); go(view); }).catch(fail);
        }
      });
    }).catch(fail);
  } };
}
function cwForm(view, cfg, r) {
  const defs = cfg.fields(r);
  modal((r[cfg.id] ? 'Edit ' : 'New ') + cfg.addLabel.toLowerCase(), formHtml(defs, r, 'Save & publish'), b => {
    const f = $('form', b);
    if (cfg.mount) cfg.mount(f, r);
    f.onsubmit = ev => {
      ev.preventDefault();
      const p = readForm(f); p[cfg.id] = r[cfg.id] || '';
      if (cfg.collect) cfg.collect(f, p);
      call(cfg.action, p).then(x => { closeModal(); cwSaved(x); go(view); }).catch(fail);
    };
  }, true);
}

/* ---------- Ramadan & Eid ---------- */
const RAMADAN_KEYS = ['RAMADAN_START', 'RAMADAN_DAYS', 'SEHRI_SAFETY_MIN', 'IFTAR_SAFETY_MIN', 'TARAWEEH_INFO', 'RAMADAN_NOTE', 'EID_FITR_DATE', 'EID_FITR_TIME', 'EID_ADHA_DATE', 'EID_ADHA_TIME', 'EID_VENUE'];
function settingField(k, s) {
  const m = (S.b.settingsMeta || []).find(x => x[0] === k); if (!m) return '';
  const t = m[3], full = /TEXT|NOTE|CONTACTS|FACILITIES|DONATE|INFO/.test(k);
  if (t === 'yesno') return field({ n: k, l: m[2], t: 'select', o: opts([['YES', 'Yes'], ['NO', 'No']], s[k]) });
  if (t === 'asr') return field({ n: k, l: m[2], t: 'select', o: opts([['Hanafi', 'Hanafi (most masjids in India)'], ['Shafi', 'Shafi / Jumhur']], s[k]) });
  if (t === 'cdate') return field({ n: k, l: m[2], t: 'date' }, { [k]: s[k] });
  if (t === 'time') return field({ n: k, l: m[2], t: 'time' }, { [k]: s[k] });
  if (t === 'signed') return field({ n: k, l: m[2], t: 'select', o: opts([['-2', '−2 days'], ['-1', '−1 day'], ['0', 'No change'], ['1', '+1 day'], ['2', '+2 days']], String(s[k] || '0')) });
  if (t === 'int' || t === 'angle') return field({ n: k, l: m[2], t: 'number', step: t === 'int' ? '1' : '0.1' }, { [k]: s[k] });
  return field({ n: k, l: m[2], t: full ? 'textarea' : 'text', full: full, attrs: /_UR$/.test(k) ? UR : '' }, { [k]: s[k] });
}
function saveCommunitySettings(form, keys) {
  const all = readForm(form), p = {}; keys.forEach(k => { if (k in all) p[k] = all[k]; });
  return call('community.settings', { settings: p }).then(r => { S.b.settings = r.settings; cwSaved(r, 'Settings saved and published.'); return refreshBoot(); });
}
VIEWS.cramadan = { perm: 'community.edit', fn: el => {
  const s = S.b.settings;
  el.innerHTML = head('Ramadan & Eid', 'Set the first Roza after moon sighting. Sehri and Iftar are calculated for every day automatically.') + noLocNote() +
    '<div class="card"><form class="form-grid" id="rf">' + RAMADAN_KEYS.map(k => settingField(k, s)).join('') +
    '<div class="full actions"><button class="btn primary">Save & publish</button><button type="button" class="btn" id="rcal">Publish Sehri/Iftar to Google Calendar</button></div></form></div><div class="card"><h3>Timetable preview</h3><div id="rt"></div></div>';
  bindGo(el);
  const f = $('#rf');
  f.onsubmit = ev => { ev.preventDefault(); saveCommunitySettings(f, RAMADAN_KEYS).then(() => go('cramadan')).catch(fail); };
  $('#rcal').onclick = () => ask('Publish to calendar', 'This adds Sehri and Iftar reminders for every Roza (and Eid) to the public calendar, replacing any earlier Ramadan entries. It takes about a minute.', { ok: 'Publish' })
    .then(v => v && call('community.ramadanSync').then(r => toast(r.events + ' calendar entries published.', 's')).catch(fail));
  const start = s.RAMADAN_START;
  if (!start || !calcOpts()) { $('#rt').innerHTML = '<p class="muted">Set the first Roza date and the masjid location to see the timetable.</p>'; return; }
  const n = Math.min(30, Math.max(29, +s.RAMADAN_DAYS || 30)), rows = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(start + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + i); const ds = d.toISOString().slice(0, 10), a = azan(ds);
    rows.push({ roza: i + 1, date: ds, sehri: t12(a.fajr - (+s.SEHRI_SAFETY_MIN || 0)), iftar: t12(a.maghrib + (+s.IFTAR_SAFETY_MIN || 0)), fajr: t12(a.fajr), maghrib: t12(a.maghrib) });
  }
  table($('#rt'), [{ k: 'roza', l: 'Roza' }, { k: 'date', l: 'Date', f: r => esc(dmy(r.date)) }, { k: 'sehri', l: 'Sehri ends' }, { k: 'iftar', l: 'Iftar' }, { k: 'fajr', l: 'Fajr Azan' }], rows, { search: false, csv: 'ramadan-timetable' });
} };

/* ---------- Website settings ---------- */
const WEB_GROUPS = [
  ['Location & calculation', ['LATITUDE', 'LONGITUDE', 'MAPS_LINK', 'ASR_METHOD', 'FAJR_ANGLE', 'ISHA_ANGLE', 'HIJRI_ADJUST']],
  ['Jumu’ah', ['JUMUAH_AZAN_TIME', 'JUMUAH_KHUTBAH_TIME', 'JUMUAH_JAMAAT_TIME']],
  ['About & contact', ['MASJID_NAME_UR', 'ABOUT_TEXT', 'ABOUT_TEXT_UR', 'PUBLIC_CONTACTS', 'FACILITIES', 'WHATSAPP_LINK', 'PUBLIC_SITE_URL', 'ADMIN_APP_URL', 'SHOW_COMMITTEE_LOGIN', 'FORMS_ENABLED']],
  ['Donations', ['UPI_ID', 'UPI_PAYEE_NAME', 'DONATE_NOTE']]
];
function parseCoords(txt) {
  txt = String(txt || '');
  let m = /@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/.exec(txt) || /!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/.exec(txt) ||
    /[?&](?:q|query|ll)=(-?\d{1,3}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/.exec(txt) || /^\s*(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/.exec(txt);
  return m ? { lat: (+m[1]).toFixed(6), lng: (+m[2]).toFixed(6) } : null;
}
VIEWS.csettings = { perm: 'community.edit', fn: el => {
  const s = S.b.settings, keys = [].concat(...WEB_GROUPS.map(g => g[1]));
  el.innerHTML = head('Website Settings', 'What the public website shows. Saved changes are published immediately.') +
    '<div class="card"><h3>Find the location quickly</h3><p class="small">In Google Maps, <b>press and hold on the masjid</b> → the coordinates appear at the top (e.g. <code>17.385044, 78.486671</code>) → tap to copy → paste here. A full Google Maps link containing “@” also works. Short “share” links cannot be read.</p>' +
    '<div class="form-grid"><label class="full">Paste coordinates or a Google Maps link<input id="coordIn" placeholder="17.385044, 78.486671"></label></div><div class="actions"><button class="btn" id="coordGo">Use these coordinates</button><span id="coordMsg" class="small"></span></div></div>' +
    '<form id="wf">' + WEB_GROUPS.map(g => '<div class="card"><h3>' + esc(g[0]) + '</h3><div class="form-grid">' + g[1].map(k => settingField(k, s)).join('') + '</div>' +
      (g[0] === 'Location & calculation' ? '<p class="small muted" id="locPrev"></p>' : '') + (g[0] === 'Donations' ? '<div id="qrBox"></div>' : '') + '</div>').join('') +
    '<div class="actions"><button class="btn primary">Save & publish</button></div></form>';
  const f = $('#wf');
  const prev = () => {
    const lat = f.LATITUDE.value, lng = f.LONGITUDE.value, t = today();
    if (!lat || !lng) { $('#locPrev').textContent = 'Enter latitude and longitude to preview today’s times.'; return; }
    const a = MasjidTimes.compute(+t.slice(0, 4), +t.slice(5, 7), +t.slice(8, 10), { lat: +lat, lng: +lng, tz: 5.5, fajrAngle: +f.FAJR_ANGLE.value || 18, ishaAngle: +f.ISHA_ANGLE.value || 18, asrFactor: f.ASR_METHOD.value === 'Shafi' ? 1 : 2 });
    const h = MasjidTimes.hijri(+t.slice(0, 4), +t.slice(5, 7), +t.slice(8, 10), +f.HIJRI_ADJUST.value || 0);
    $('#locPrev').textContent = 'Preview for today — Fajr ' + t12(a.fajr) + ' · Sunrise ' + t12(a.sunrise) + ' · Zuhr ' + t12(a.dhuhr) + ' · Asr ' + t12(a.asr) + ' · Maghrib ' + t12(a.maghrib) + ' · Isha ' + t12(a.isha) + '  |  Hijri: ' + h.d + ' ' + h.en + ' ' + h.y + '. Compare with a trusted local timetable once.';
  };
  ['LATITUDE', 'LONGITUDE', 'FAJR_ANGLE', 'ISHA_ANGLE', 'ASR_METHOD', 'HIJRI_ADJUST'].forEach(k => f[k].addEventListener('input', prev)); prev();
  $('#coordGo').onclick = () => {
    const c = parseCoords($('#coordIn').value);
    if (!c) { $('#coordMsg').textContent = 'Could not find coordinates in that text.'; $('#coordMsg').className = 'small err'; return; }
    f.LATITUDE.value = c.lat; f.LONGITUDE.value = c.lng; $('#coordMsg').textContent = '✔ Filled in — check the preview, then Save.'; $('#coordMsg').className = 'small ok';
    if (/^https:\/\//.test($('#coordIn').value.trim()) && !f.MAPS_LINK.value) f.MAPS_LINK.value = $('#coordIn').value.trim();
    prev();
  };
  f.onsubmit = ev => { ev.preventDefault(); saveCommunitySettings(f, keys).then(() => go('csettings')).catch(fail); };
  const qrb = $('#qrBox');
  qrb.innerHTML = '<label class="full">UPI QR code image (PNG/JPG, under 150 KB)<input type="file" id="qrFile" accept="image/png,image/jpeg"></label><div class="actions"><button type="button" class="btn" id="qrUp">Upload QR</button>' +
    '<button type="button" class="btn danger" id="qrRm">Remove QR</button></div>';
  $('#qrUp').onclick = () => {
    const file = $('#qrFile').files[0]; if (!file) return toast('Choose the QR image first.', 'e');
    if (file.size > 150000 || !/^image\/(png|jpeg)$/.test(file.type)) return toast('Use a PNG or JPG under 150 KB (QR codes must not be compressed).', 'e');
    const rd = new FileReader(); rd.onload = () => call('community.qr', { file: { name: file.name, mimeType: file.type, data: String(rd.result).split(',')[1] } }).then(() => toast('QR uploaded and published.', 's')).catch(fail); rd.readAsDataURL(file);
  };
  $('#qrRm').onclick = () => call('community.qr', { remove: true }).then(() => toast('QR removed.', 's')).catch(fail);
} };

/* ---------- Requests from the website ---------- */
VIEWS.crequests = { perm: 'community.requests', fn: (el, params) => {
  const status = params.Status === undefined ? 'New' : params.Status;
  el.innerHTML = head('Requests from the website', 'Nikah, hall booking, volunteering and queries. Phone numbers here are private — never shown on the website.') +
    '<div class="tabs">' + [['New', 'New'], ['In progress', 'In progress'], ['Done', 'Done'], ['Spam', 'Spam'], ['', 'All']].map(x => '<button data-s="' + x[0] + '" class="' + (x[0] === status ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div><div class="card" id="rq">Loading…</div>';
  $$('.tabs button', el).forEach(b => b.onclick = () => go('crequests', { Status: b.dataset.s }));
  call('community.requests', { Status: status }).then(rows => table($('#rq'), [
    { k: 'SubmittedAt', l: 'Received', f: r => esc(dmy(r.SubmittedAt)) }, { k: 'Type', l: 'Type' }, { k: 'Name', l: 'Name' }, { k: 'Phone', l: 'Phone', f: r => '<a href="tel:' + esc(r.Phone.replace(/[^\d+]/g, '')) + '">' + esc(r.Phone) + '</a>' },
    { k: 'PreferredDate', l: 'Preferred date', f: r => esc(dmy(r.PreferredDate)) }, { k: 'Message', l: 'Message', f: r => '<span class="small">' + esc(r.Message) + '</span>' },
    { k: 'Status', l: 'Status', f: r => esc(r.Status) + (r.HandledBy ? '<div class="muted small">' + esc(r.HandledBy) + (r.Note ? ': ' + esc(r.Note) : '') + '</div>' : '') }], rows, {
    csv: 'website-requests', empty: 'No requests here.',
    actions: r => { const ph = r.Phone.replace(/\D/g, ''), wa = ph.length === 10 ? '91' + ph : ph;
      return '<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/' + esc(wa) + '">WhatsApp</a> ' + act('p', 'In progress') + act('d', 'Done') + act('s', 'Spam', 'danger'); },
    onAction: (a, r) => ask('Update request', 'Mark this request as ' + { p: 'In progress', d: 'Done', s: 'Spam' }[a] + '?', { input: 'Note (optional)', ok: 'Update' })
      .then(v => v !== null && call('community.requestUpdate', { ReqID: r.ReqID, Status: { p: 'In progress', d: 'Done', s: 'Spam' }[a], Note: v === true ? '' : v }).then(() => { toast('Updated.', 's'); go('crequests', { Status: status }); }).catch(fail))
  })).catch(fail);
} };
</script>
